/* حجز "متأخر" = حجز موعد اليوم تجاوز وقته بأكثر من 15 دقيقة ولم يُخدم بعد، أو دور طابور تم تخطيه */
function isBookingLate(bk, dateStr){
  if(bk.status === 'cancelled' || bk.status === 'served') return false;
  if(bk.status === 'skipped') return true;
  if(bk.ticketNum) return false;
  const todayStr = isoDateLocal(new Date());
  if(dateStr !== todayStr || !bk.time) return false;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  return nowMin > timeToMinutes(bk.time) + 15;
}

function daysInMonth(year, month){ return new Date(year, month + 1, 0).getDate(); }

function paintCalendarMonth(biz){
  const grid = document.getElementById('calMonthGrid');
  const label = document.getElementById('calMonthLabel');
  if(!grid) return;

  const { year, month } = CAL_STATE;
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  if(label) label.textContent = monthNames[month] + ' ' + year;

  const startWeekday = new Date(year, month, 1).getDay();
  const totalDays = daysInMonth(year, month);
  const todayStr = isoDateLocal(new Date());
  const closedDays = biz.closedDays || [];
  const enableJapanHolidays = biz.enableJapanHolidays !== false;
  const bookings = (CAL_BOOKINGS_CACHE.bizId === biz.id) ? CAL_BOOKINGS_CACHE.bookings : [];

  // عدد الساعات المتاحة يومياً حسب نظام المحل (فقط لحجوزات الوقت — ليس الطابور ولا الفنادق)
  const isTimeBasedBiz = biz.mode !== 'queue' && biz.category !== 'hotel';
  const totalSlotsPerDay = isTimeBasedBiz ? generateSlots(biz.schedule || { startTime: '11:00', endTime: '21:00', slotDuration: 30 }).length : null;

  let cells = '';
  for(let i = 0; i < startWeekday; i++){ cells += `<div></div>`; }

  for(let day = 1; day <= totalDays; day++){
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    const weekday = new Date(year, month, day).getDay();
    const isClosed = closedDays.includes(weekday) || !!(enableJapanHolidays && checkJapanHoliday(dateStr));
    const dayBookings = bookings.filter(bk => bookingMatchesDate(bk, dateStr) && bk.status !== 'cancelled' && bk.status !== 'served');
    const hasLate = dayBookings.some(bk => isBookingLate(bk, dateStr));
    const count = dayBookings.length;
    const isFull = totalSlotsPerDay !== null && totalSlotsPerDay > 0 && count >= totalSlotsPerDay;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === CAL_STATE.selectedDate;

    let cls = 'bg-white border border-slate-200';
    if(isClosed) cls = 'bg-slate-100 border border-slate-200 text-slate-400';
    else if(isFull) cls = 'bg-rose-50 border border-rose-300';
    else if(hasLate) cls = 'bg-amber-50 border border-amber-300';
    else if(count > 0) cls = 'bg-blue-50 border border-blue-300';
    if(isSelected) cls += ' ring-2 ring-blue-600';

    let badgeHtml = '';
    if(count > 0){
      const badgeColor = isFull ? 'bg-rose-600' : (hasLate ? 'bg-amber-500' : 'bg-blue-600');
      badgeHtml = `<div class="mt-0.5 text-[9px] ${badgeColor} text-white rounded-full inline-block px-1.5 py-0.5 font-bold">${isFull ? 'ممتلئ' : count}</div>`;
    } else if(isClosed){
      badgeHtml = `<div class="mt-0.5 text-[9px] text-slate-400">عطلة</div>`;
    }

    cells += `
      <div onclick="selectCalendarDay('${biz.id}','${dateStr}')" class="rounded-lg p-1.5 cursor-pointer text-center relative ${cls}" style="min-height:50px;">
        <div class="text-[11px] ${isToday ? 'text-blue-700 font-extrabold' : 'text-slate-700'}">${day}</div>
        ${badgeHtml}
      </div>`;
  }

  grid.innerHTML = `
    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-1">
      <div>أحد</div><div>اثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
    </div>
    <div class="grid grid-cols-7 gap-1">${cells}</div>
    <div class="flex items-center gap-3 mt-3 text-[10px] text-slate-500 flex-wrap">
      <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-50 border border-blue-300 inline-block"></span> يوجد حجوزات</div>
      <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-rose-50 border border-rose-300 inline-block"></span> يوم ممتلئ</div>
      <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-50 border border-amber-300 inline-block"></span> يوجد حجز متأخر</div>
      <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-white border border-slate-200 inline-block"></span> بدون حجوزات</div>
      <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-100 border border-slate-200 inline-block"></span> يوم عطلة</div>
    </div>`;
  lucide.createIcons();
}

function calShiftMonth(delta){
  if(!CAL_STATE.biz) return;
  CAL_STATE.month += delta;
  if(CAL_STATE.month < 0){ CAL_STATE.month = 11; CAL_STATE.year--; }
  if(CAL_STATE.month > 11){ CAL_STATE.month = 0; CAL_STATE.year++; }
  paintCalendarMonth(CAL_STATE.biz);
}

function calJumpToday(){
  if(!CAL_STATE.biz) return;
  const now = new Date();
  CAL_STATE.year = now.getFullYear();
  CAL_STATE.month = now.getMonth();
  CAL_STATE.selectedDate = isoDateLocal(now);
  paintCalendarMonth(CAL_STATE.biz);
  paintCalendarDayDetail(CAL_STATE.biz);
}

function selectCalendarDay(bizId, dateStr){
  CAL_STATE.selectedDate = dateStr;
  const searchInput = document.getElementById('calSearchInput');
  if(searchInput) searchInput.value = '';
  paintCalendarMonth(CAL_STATE.biz);
  paintCalendarDayDetail(CAL_STATE.biz);
}

function paintCalendarTodayStats(biz){
  const el = document.getElementById('calTodayStats');
  if(!el) return;
  const todayStr = isoDateLocal(new Date());
  const bookings = (CAL_BOOKINGS_CACHE.bizId === biz.id) ? CAL_BOOKINGS_CACHE.bookings : [];
  const todayBookings = bookings.filter(bk => bookingMatchesDate(bk, todayStr));
  const active = todayBookings.filter(bk => bk.status !== 'cancelled' && bk.status !== 'served');
  const lateCount = todayBookings.filter(bk => isBookingLate(bk, todayStr)).length;
  const cancelledCount = todayBookings.filter(bk => bk.status === 'cancelled').length;

  el.innerHTML = `
    <div class="washi-card rounded-xl p-3 text-center">
      <div class="text-2xl font-extrabold text-blue-700">${active.length}</div>
      <div class="text-[10px] text-slate-500 font-bold">حجوزات اليوم</div>
    </div>
    <div class="washi-card rounded-xl p-3 text-center">
      <div class="text-2xl font-extrabold text-amber-600">${lateCount}</div>
      <div class="text-[10px] text-slate-500 font-bold">متأخرة</div>
    </div>
    <div class="washi-card rounded-xl p-3 text-center">
      <div class="text-2xl font-extrabold text-rose-600">${cancelledCount}</div>
      <div class="text-[10px] text-slate-500 font-bold">ملغاة</div>
    </div>`;
}

/* أداة "عرض الساعات": تعرض كل ساعات عمل المحل في اليوم المختار، وتميّز المحجوز منها (لأنظمة المواعيد فقط) */
function buildHoursToolHtml(biz, dateStr, dayBookings){
  const schedule = biz.schedule || { startTime: '11:00', endTime: '21:00', slotDuration: 30 };
  const slots = generateSlots(schedule);
  const bookedTimes = {};
  dayBookings.forEach(bk => {
    if(bk.time && bk.status !== 'cancelled' && bk.status !== 'served') bookedTimes[bk.time] = bk.visitorName || bk.name || 'محجوز';
  });

  return `
    <div class="bg-slate-50 rounded-xl border border-slate-200 p-3 mb-3">
      <div class="text-[10px] font-bold text-slate-500 mb-2">عرض الساعات — اضغط على ساعة متاحة لإضافة حجز فيها مباشرة</div>
      <div class="flex flex-wrap gap-1.5">
        ${slots.map(t => {
          const booked = bookedTimes[t];
          if(booked){
            return `<span class="text-[10px] font-mono px-2 py-1 rounded-lg bg-rose-100 text-rose-700 font-bold" title="${esc(booked)}">${t}</span>`;
          }
          return `<button type="button" onclick="openAddBookingModalForDateTime('${biz.id}','${dateStr}','${t}')" class="text-[10px] font-mono px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 cursor-pointer" title="متاح — اضغط للحجز">${t}</button>`;
        }).join('')}
      </div>
      <div class="flex items-center gap-3 mt-2 text-[9px] text-slate-500">
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-50 border border-emerald-200 inline-block"></span> متاح</div>
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-rose-100 inline-block"></span> محجوز</div>
      </div>
    </div>`;
}

function bookingRowHtml(biz, bk, dateStr, showDateLabel){
  const isCancelled = bk.status === 'cancelled';
  const late = isBookingLate(bk, dateStr);
  const rowCls = isCancelled ? 'opacity-50 bg-white border-slate-200' : (late ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200');
  const timeLabel = bk.checkIn ? (bk.checkIn + ' → ' + bk.checkOut) : (bk.time || bk.ticketNum || '—');

  return `
    <div class="flex items-center justify-between gap-2 p-2.5 rounded-lg border ${rowCls}">
      <div>
        <div class="font-bold text-slate-800">
          ${esc(bk.visitorName || bk.name || 'بدون اسم')}
          ${bk.ticketNum ? `<span class="text-[10px] text-slate-400 font-mono">(${esc(bk.ticketNum)})</span>` : ''}
        </div>
        <div class="text-[10px] text-slate-500 font-mono">${showDateLabel ? esc(dateStr) + ' · ' : ''}${esc(timeLabel)} ${bk.guests ? '· ' + bk.guests + ' أشخاص' : ''}</div>
        ${late ? `<span class="text-[9px] text-amber-700 font-bold">⏰ متأخر</span>` : ''}
        ${isCancelled ? `<span class="text-[9px] text-rose-700 font-bold">ملغى</span>` : ''}
      </div>
      <div class="flex items-center gap-2 text-[11px] whitespace-nowrap">
        ${showDateLabel ? `<button onclick="selectCalendarDay('${biz.id}','${dateStr}')" class="text-blue-600 hover:underline font-bold">عرض اليوم</button>` : ''}
        ${!isCancelled ? `<button onclick="openEditBookingModal('${biz.id}','${bk.id}')" class="text-blue-600 hover:underline font-bold">تعديل</button>` : ''}
        ${!isCancelled ? `<button onclick="cancelBookingFromCalendar('${biz.id}','${bk.id}')" class="text-rose-600 hover:underline font-bold">إلغاء</button>` : ''}
      </div>
    </div>`;
}

function paintCalendarDayDetail(biz){
  const el = document.getElementById('calDayDetail');
  if(!el) return;

  const dateStr = CAL_STATE.selectedDate;
  const bookings = (CAL_BOOKINGS_CACHE.bizId === biz.id) ? CAL_BOOKINGS_CACHE.bookings : [];
  const dayBookings = bookings
    .filter(bk => bookingMatchesDate(bk, dateStr) && bk.status !== 'served')
    .sort((a, b) => {
      const ta = a.time ? timeToMinutes(a.time) : (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0);
      const tb = b.time ? timeToMinutes(b.time) : (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0);
      return ta - tb;
    });

  const dateLabel = new Date(dateStr + 'T00:00:00').toLocaleDateString('ar', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const listHtml = dayBookings.length === 0
    ? `<p class="text-center text-slate-400 py-6">لا توجد حجوزات في هذا اليوم.</p>`
    : dayBookings.map(bk => bookingRowHtml(biz, bk, dateStr, false)).join('');

  const hoursToolHtml = (biz.mode !== 'queue' && biz.category !== 'hotel') ? buildHoursToolHtml(biz, dateStr, dayBookings) : '';

  el.innerHTML = `
    <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
      <h3 class="font-bold text-slate-800">${dateLabel}</h3>
      <button onclick="openAddBookingModalForDate('${biz.id}','${dateStr}')" class="ink-btn text-[11px] px-3 py-1.5 rounded-lg font-bold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> إضافة حجز لهذا اليوم</button>
    </div>
    ${hoursToolHtml}
    <div class="space-y-2">${listHtml}</div>`;
  lucide.createIcons();
}

function onCalendarSearch(bizId){
  const q = ((document.getElementById('calSearchInput') || {}).value || '').trim().toLowerCase();
  if(!q){ paintCalendarDayDetail(CAL_STATE.biz); return; }

  const bookings = (CAL_BOOKINGS_CACHE.bizId === bizId) ? CAL_BOOKINGS_CACHE.bookings : [];
  const results = bookings.filter(bk => (bk.visitorName || bk.name || '').toLowerCase().includes(q) && bk.status !== 'served');
  const el = document.getElementById('calDayDetail');
  if(!el) return;

  const listHtml = results.length === 0
    ? `<p class="text-center text-slate-400 py-6">لا توجد نتائج مطابقة.</p>`
    : results.map(bk => {
        const dateStr = bk.checkIn || bk.date || (bk.createdAt && bk.createdAt.toDate ? isoDateLocal(bk.createdAt.toDate()) : '');
        return bookingRowHtml(CAL_STATE.biz, bk, dateStr, true);
      }).join('');

  el.innerHTML = `<h3 class="font-bold text-slate-800 mb-3">نتائج البحث عن "${esc(q)}" (${results.length})</h3><div class="space-y-2">${listHtml}</div>`;
  lucide.createIcons();
}

function openAddBookingModalForDate(bizId, dateStr){
  showAddBookingModal(bizId, dateStr);
}

function openAddBookingModalForDateTime(bizId, dateStr, timeStr){
  showAddBookingModal(bizId, dateStr, timeStr);
}

function cancelBookingFromCalendar(bizId, bookingId){
  if(!confirm('هل تريد إلغاء هذا الحجز؟')) return;
  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingId)
    .update({ status: 'cancelled', cancelledAt: firebase.firestore.FieldValue.serverTimestamp() })
    .then(() => refreshCalendarView(bizId))
    .catch(err => alert('تعذر إلغاء الحجز: ' + err.message));
}

function refreshCalendarView(bizId){
  loadCalendarBookings(bizId, () => {
    if(!CAL_STATE.biz) return;
    paintCalendarTodayStats(CAL_STATE.biz);
    paintCalendarMonth(CAL_STATE.biz);
    const q = ((document.getElementById('calSearchInput') || {}).value || '').trim();
    if(q) onCalendarSearch(bizId); else paintCalendarDayDetail(CAL_STATE.biz);
  });
}

/* =========================================================================
   نافذة تعديل حجز موجود (اسم، بريد، عدد الأشخاص، وتاريخ/ساعة أو إقامة الفندق)
   ========================================================================= */
function editBookingModalMarkup(){
  return `
  <div id="editBookingModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-start justify-center hidden p-4 overflow-y-auto">
    <div class="washi-card rounded-2xl p-6 max-w-md w-full space-y-3 my-8 text-xs">
      <h3 class="font-bold text-lg text-slate-900 border-b border-slate-200 pb-3">تعديل الحجز</h3>
      <input type="hidden" id="editBkBizId" value="">
      <input type="hidden" id="editBkDocId" value="">
      <div id="editBookingFields" class="space-y-3">جاري التحميل...</div>
      <p id="editBookingError" class="text-rose-600 font-bold"></p>
      <div class="pt-2 flex gap-2">
        <button onclick="submitEditBooking()" class="ink-btn flex-1 py-2.5 rounded-xl font-bold text-xs">حفظ التعديلات</button>
        <button onclick="closeEditBookingModal()" class="ghost-btn py-2.5 px-4 rounded-xl font-bold text-xs">إلغاء</button>
      </div>
    </div>
  </div>`;
}

function openEditBookingModal(bizId, bookingId){
  document.getElementById('editBookingError').textContent = '';
  document.getElementById('editBkBizId').value = bizId;
  document.getElementById('editBkDocId').value = bookingId;
  const fieldsEl = document.getElementById('editBookingFields');
  fieldsEl.innerHTML = 'جاري التحميل...';
  document.getElementById('editBookingModal').classList.remove('hidden');

  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingId).get().then(doc => {
    if(!doc.exists){ fieldsEl.innerHTML = `<p class="text-rose-600">تعذر العثور على هذا الحجز.</p>`; return; }
    const bk = doc.data();

    let fieldsHtml = `
      <div>
        <label class="text-[11px] text-slate-600 block mb-0.5">اسم الزبون:</label>
        <input id="editBkName" type="text" value="${esc(bk.visitorName || bk.name || '')}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
      </div>
      <div>
        <label class="text-[11px] text-slate-600 block mb-0.5">البريد الإلكتروني:</label>
        <input id="editBkEmail" type="email" value="${esc(bk.visitorEmail || bk.email || '')}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300 font-mono">
      </div>
      <div>
        <label class="text-[11px] text-slate-600 block mb-0.5">عدد الأشخاص:</label>
        <input id="editBkGuests" type="number" min="1" value="${bk.guests || 1}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
      </div>`;

    if(bk.checkIn){
      fieldsHtml += `
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-600 block mb-0.5">تاريخ الوصول:</label>
          <input id="editBkCheckIn" type="date" value="${esc(bk.checkIn)}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
        </div>
        <div>
          <label class="text-[11px] text-slate-600 block mb-0.5">تاريخ المغادرة:</label>
          <input id="editBkCheckOut" type="date" value="${esc(bk.checkOut)}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
        </div>
      </div>`;
    } else if(bk.date && !bk.ticketNum){
      fieldsHtml += `
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-600 block mb-0.5">التاريخ:</label>
          <input id="editBkDate" type="date" value="${esc(bk.date)}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
        </div>
        <div>
          <label class="text-[11px] text-slate-600 block mb-0.5">الساعة:</label>
          <input id="editBkTime" type="time" value="${esc(bk.time || '')}" class="w-full rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
        </div>
      </div>`;
    }

    fieldsEl.innerHTML = fieldsHtml;
  }).catch(err => {
    fieldsEl.innerHTML = `<p class="text-rose-600">تعذر تحميل بيانات الحجز: ${esc(err.message)}</p>`;
  });
}

function closeEditBookingModal(){ document.getElementById('editBookingModal').classList.add('hidden'); }

function submitEditBooking(){
  const bizId = document.getElementById('editBkBizId').value;
  const bookingId = document.getElementById('editBkDocId').value;
  const errEl = document.getElementById('editBookingError');
  const nameEl = document.getElementById('editBkName');
  const name = nameEl ? nameEl.value.trim() : '';
  if(!name){ errEl.textContent = 'يرجى كتابة اسم الزبون.'; return; }

  const data = { visitorName: name };
  const emailEl = document.getElementById('editBkEmail');
  if(emailEl) data.visitorEmail = emailEl.value.trim();
  const guestsEl = document.getElementById('editBkGuests');
  if(guestsEl) data.guests = parseInt(guestsEl.value) || 1;
  const checkInEl = document.getElementById('editBkCheckIn');
  const checkOutEl = document.getElementById('editBkCheckOut');
  if(checkInEl && checkOutEl){ data.checkIn = checkInEl.value; data.checkOut = checkOutEl.value; }
  const dateEl = document.getElementById('editBkDate');
  const timeEl = document.getElementById('editBkTime');
  if(dateEl) data.date = dateEl.value;
  if(timeEl) data.time = timeEl.value;

  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingId).update(data).then(() => {
    closeEditBookingModal();
    if(CAL_STATE.bizId === bizId){ refreshCalendarView(bizId); }
    else if(BOOKINGS_CACHE.bizId === bizId){ loadBookingsForStore(bizId); }
  }).catch(err => {
    errEl.textContent = 'تعذر حفظ التعديلات: ' + err.message;
  });
}

/* التشغيل الأولي */
route();
</script>

<!-- =========================================================================
     جسر تطبيق أندرويد (Capacitor): يُحمَّل فقط داخل نسخة التطبيق المبنية عبر
     GitHub Actions (انظر native-bridge.js + esbuild في سير عمل البناء).
     عند فتح الملف كموقع عادي بالمتصفح، هذا السطر يفشل بصمت (404) ولا يؤثر
     على عمل الموقع إطلاقاً — window.YoyakoNative يبقى undefined.
     ========================================================================= -->
<script src="native-bridge.bundled.js"></script>
<script>
  function getStoredFcmToken(){
    try{ return localStorage.getItem('yoyako_fcm_token') || null; } catch(e){ return null; }
  }

  if(window.YoyakoNative){
    YoyakoNative.hideSplash();

    YoyakoNative.initPushNotifications(function(token){
      try{ localStorage.setItem('yoyako_fcm_token', token); } catch(e){}
    });

    YoyakoNative.onNetworkChange(function(online){
      document.body.classList.toggle('is-offline', !online);
      const bar = document.getElementById('offlineBar');
      if(bar) bar.classList.toggle('hidden', online);
    });

    // فتح صفحة الحجز مباشرة عند الضغط على رابط عميق (مثل الضغط على إشعار والتطبيق مغلق)
    YoyakoNative.handleAppUrlOpen(function(url){
      // رابط ويب فيه # (مثل https://yoyako.cloud/#/b/xxx): خذي كل ما بعد # كما هو
      if(url.indexOf('#') > -1){
        location.hash = '#' + url.split('#')[1];
        return;
      }
      // مخطط رابط مخصص (مثل cloud.yoyako.app://b/xxx) بدون #
      const m = url.match(/:\/\/[^/]+\/?(.*)$/);
      if(m && m[1]) location.hash = '#/' + m[1];
    });
  }
</script>
