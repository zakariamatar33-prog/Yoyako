   إعداد EmailJS (اختياري) — لإرسال رسالة تأكيد الحجز تلقائيًا لبريد الزائر

      booking_time, booking_link — واحصل على Template ID

   ========================================================================= */
const EMAILJS_PUBLIC_KEY  = "";

const JAPAN_HOLIDAYS_FIXED = {
  "01-01": "元日 (رأس السنة)",
  "01-02": "初売り (عطلة البنوك)",
  "01-03": "銀行休業日 (عطلة البنوك)",

  "05-03": "憲法記念日 (يوم الدستور)",
  "05-04": "みどりの日 (يوم الخضرة)",
  "05-05": "こどもの日 (عيد الأطفال)",
  "08-11": "山の日 (يوم الجبل)",
  "11-03": "文化の日 (يوم الثقافة)",

};

function checkJapanHoliday(dateStr) {
  if(!dateStr) return null;
  const parts = dateStr.split('-');
  if(parts.length < 3) return null;
  const monthDay = `${parts[1]}-${parts[2]}`;
  
  if(JAPAN_HOLIDAYS_FIXED[monthDay]) {
    return JAPAN_HOLIDAYS_FIXED[monthDay];
  }

  const d = new Date(dateStr);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const dayOfWeek = d.getDay();

  if(month === 1 && dayOfWeek === 1 && day >= 8 && day <= 14) return "成人の日 (يوم البالغين)";
  if(month === 7 && dayOfWeek === 1 && day >= 15 && day <= 21) return "海の日 (يوم البحر)";
  if(month === 9 && dayOfWeek === 1 && day >= 15 && day <= 21) return "敬老の日 (احترام الكبار)";
  if(month === 10 && dayOfWeek === 1 && day >= 8 && day <= 14) return "スポーツの日 (يوم الرياضة)";

  return null;
}

function timeToMinutes(t){ const p=t.split(':'); return (+p[0])*60 + (+p[1]); }
function minutesToTime(m){ const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function isoDateLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* رقم دور تسلسلي (01, 02, 03...) يُعاد ضبطه يومياً لكل محل، عبر معاملة Firestore لمنع التكرار */
function getNextQueueNumber(bizId){
  const bizRef = db.collection(BIZ_COLLECTION_PATH).doc(bizId);
  const today = isoDateLocal(new Date());
  return db.runTransaction(tx => {
    return tx.get(bizRef).then(doc => {
      const data = doc.data() || {};
      let counter = 1;
      if(data.queueCounterDate === today && data.queueCounter){
        counter = data.queueCounter + 1;
      }
      tx.set(bizRef, { queueCounter: counter, queueCounterDate: today }, { merge: true });
      return counter;
    });
  }).then(counter => String(counter).padStart(2, '0'));
}

function generateSlots(schedule){
  const slots = [];
  const start = timeToMinutes(schedule.startTime || '11:00');
  const end = timeToMinutes(schedule.endTime || '21:00');
  const dur = parseInt(schedule.slotDuration) || 30;

  const breakStart = schedule.breakStart ? timeToMinutes(schedule.breakStart) : null;
  const breakEnd = schedule.breakEnd ? timeToMinutes(schedule.breakEnd) : null;

  for(let t=start; t+dur<=end; t+=dur){
    if(breakStart !== null && breakEnd !== null && t >= breakStart && t < breakEnd){
      continue;
    }
    slots.push(minutesToTime(t));
  }
  return slots;
}

/* توليد الأيام المتاحة حسب الحد الأقصى الذي حدده صاحب المحل (من 0 يوم إلى أشهر) */
function nextAvailableDays(maxDaysOption){
  const days = [];
  const today = new Date();
  
  // تحويل خيار المدى الزمني إلى عدد أيام
  let maxDays = 14;
  if(maxDaysOption === 0 || maxDaysOption === "0") maxDays = 1; // نفس اليوم فقط
  else if(maxDaysOption === 2 || maxDaysOption === "2") maxDays = 2; // يومين
  else if(maxDaysOption === 7 || maxDaysOption === "7") maxDays = 7; // أسبوع
  else if(maxDaysOption === 30 || maxDaysOption === "30") maxDays = 30; // شهر
  else if(maxDaysOption === 90 || maxDaysOption === "90") maxDays = 90; // 3 أشهر
  else if(maxDaysOption === 180 || maxDaysOption === "180") maxDays = 180; // 6 أشهر
  else if(typeof maxDaysOption === 'number') maxDays = maxDaysOption;

  for(let i=0; i<maxDays; i++){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()+i);
    days.push({ 
      date: isoDateLocal(d), 
      weekday: d.getDay(), 
      label: d.toLocaleDateString('ar-EG', {weekday:'short', day:'numeric', month:'short'}) 
    });
  }
  return days;
}

async function ensureAuthenticated() {
  if (auth.currentUser) {
    CURRENT_USER = auth.currentUser;
    return auth.currentUser;
  }
  try {
    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
      const res = await auth.signInWithCustomToken(__initial_auth_token);
      CURRENT_USER = res.user;
    } else {
      const res = await auth.signInAnonymously();
      CURRENT_USER = res.user;
    }
  } catch (e) {
    console.warn("Auth fallback:", e);
    const res = await auth.signInAnonymously();
    CURRENT_USER = res.user;
  }
  return CURRENT_USER;
}

auth.onAuthStateChanged(user => {
  CURRENT_USER = user;
  AUTH_READY = true;
  route();
});

   التوجيه (Router)
   ========================================================================= */
window.addEventListener('hashchange', route);

async function route(){
  if (!AUTH_READY) {
    await ensureAuthenticated();
  }

  if(DISPLAY_POLL_INTERVAL){ clearInterval(DISPLAY_POLL_INTERVAL); DISPLAY_POLL_INTERVAL = null; }

  const hash = location.hash || '#/';

  const publicMatch = hash.match(/^#\/b\/([^/]+)/);
  if(publicMatch){ renderPublicBooking(publicMatch[1]); return; }

  const ticketMatch = hash.match(/^#\/ticket\/([^/]+)\/([^/]+)\/([^/]+)/);
  if(ticketMatch){ renderTicketView(ticketMatch[1], ticketMatch[2], ticketMatch[3]); return; }

  const staffMatch = hash.match(/^#\/staff\/([^/]+)\/([^/]+)/);
  if(staffMatch){ renderStaffGate(staffMatch[1], staffMatch[2]); return; }

  const displayMatch = hash.match(/^#\/display\/([^/]+)\/([^/]+)/);
  if(displayMatch){ renderDisplayGate(displayMatch[1], displayMatch[2]); return; }

  const kioskMatch = hash.match(/^#\/kiosk\/([^/]+)\/([^/]+)/);
  if(kioskMatch){ renderKioskPage(kioskMatch[1], kioskMatch[2]); return; }

  const calendarMatch = hash.match(/^#\/calendar\/([^/]+)\/([^/]+)/);
  if(calendarMatch){ renderCalendarGate(calendarMatch[1], calendarMatch[2]); return; }

  if(hash === '#/admin'){
    if(!CURRENT_USER || CURRENT_USER.isAnonymous){ renderAuthGate(); return; }
    if(!isSiteAdmin()){
      app.innerHTML = `${topBar('غير مصرح')}<div class="p-10 text-center font-bold text-rose-600">هذا الحساب لا يملك صلاحية الوصول للوحة المدير.</div>`;
      return;
    }
    renderAdminDashboard();
    return;
  }

  const manageMatch = hash.match(/^#\/manage\/([^/]+)/);
  if(manageMatch){
    if(!CURRENT_USER || CURRENT_USER.isAnonymous){ renderAuthGate(); return; }
    renderStoreManagePage(manageMatch[1]);
    return;
  }

  // نسخة التطبيق (Android): لا تتضمن لوحة تحكم صاحب المحل ولا تسجيل الدخول —
  // للعميل فقط. لا تُظهر بوابة الدخول أبداً هنا.
  if(window.YoyakoNative && window.YoyakoNative.isNative){
    renderCustomerHome();
    return;
  }

  // لوحة تحكم صاحب المحل (نسخة الويب فقط) تتطلب تسجيل دخول حقيقي (Google أو بريد/كلمة مرور) — لا يُسمح بالدخول كزائر مجهول
  if(!CURRENT_USER || CURRENT_USER.isAnonymous){
    renderAuthGate();
    return;
  }

  renderOwnerDashboard();
}

        <div class="flex items-center gap-2">
          ${isSiteAdmin() ? `<button onclick="go('#/admin')" class="ghost-btn text-xs px-2.5 py-1.5 rounded-lg text-purple-700 font-bold flex items-center gap-1"><i data-lucide="shield" class="w-3.5 h-3.5"></i> لوحة المدير</button>` : ''}
          ${CURRENT_USER.photoURL ? `<img src="${CURRENT_USER.photoURL}" class="w-7 h-7 rounded-full border border-slate-300">` : ''}
          <span class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-bold">${esc(userLabel)}</span>
          ${isAnon ? `
            <button onclick="signInWithGoogle()" class="ink-btn text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
              <i data-lucide="log-in" class="w-3.5 h-3.5"></i> ربط بـ Google
            </button>
          ` : `
            <button onclick="signOutUser()" class="ghost-btn text-xs px-2.5 py-1.5 rounded-lg text-rose-600 font-bold">خروج</button>
          `}
        </div>
      ` : ''}
    </div>
  </div>`;
}

function signInWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res => {
    CURRENT_USER = res.user;
    route();
  }).catch(err => {
    alert("ملاحظة تسجيل الدخول: " + err.message + "\nتمت المتابعة باستخدام الجلسة الآمنة الحالية.");
  });
}

function signOutUser(){
  auth.signOut().then(() => {
    ensureAuthenticated().then(() => route());
  });
}

function toggleAuthGateMode(){
  AUTH_GATE_MODE = AUTH_GATE_MODE === 'login' ? 'signup' : 'login';
  applyAuthGateMode();
}

function applyAuthGateMode(){
  const title = document.getElementById('authGateTitle');
  const subtitle = document.getElementById('authGateSubtitle');
  const submitBtn = document.getElementById('authGateSubmitBtn');
  const toggleText = document.getElementById('authGateToggleText');
  const toggleBtn = document.getElementById('authGateToggleBtn');
  const errEl = document.getElementById('authGateError');
  if(!title) return;

  if(AUTH_GATE_MODE === 'signup'){
    title.textContent = 'إنشاء حساب جديد';
    subtitle.textContent = 'أنشئ حساباً لبدء إدارة صفحات حجز محلاتك.';
    submitBtn.textContent = 'إنشاء الحساب';
    toggleText.textContent = 'لديك حساب بالفعل؟';
    toggleBtn.textContent = 'تسجيل الدخول';
  } else {
    title.textContent = 'تسجيل الدخول للوحة التحكم';
    subtitle.textContent = 'سجّل الدخول لإدارة صفحات محلاتك ومواعيدك المحجوزة.';
    submitBtn.textContent = 'تسجيل الدخول';
    toggleText.textContent = 'ليس لديك حساب؟';
    toggleBtn.textContent = 'إنشاء حساب جديد';
  }
  if(errEl) errEl.textContent = '';
}

function submitAuthGate(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authGateError');

  if(!email || !password){
    errEl.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور.';
    return;
  }
  if(password.length < 6){
    errEl.textContent = 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.';
    return;
  }

  errEl.textContent = 'جاري المعالجة...';

  const action = AUTH_GATE_MODE === 'signup'
    ? auth.createUserWithEmailAndPassword(email, password)
    : auth.signInWithEmailAndPassword(email, password);

  action.then(res => {
    CURRENT_USER = res.user;
    route();
  }).catch(err => {
    errEl.textContent = translateAuthError(err);
  });
}

function translateAuthError(err){
  const map = {
    'auth/email-already-in-use': 'هذا البريد الإلكتروني مسجل بالفعل، جرّب تسجيل الدخول بدلاً من ذلك.',
    'auth/invalid-email': 'صيغة البريد الإلكتروني غير صحيحة.',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد الإلكتروني.',
    'auth/wrong-password': 'كلمة المرور غير صحيحة.',
    'auth/weak-password': 'كلمة المرور ضعيفة جداً، استخدم 6 أحرف على الأقل.',
    'auth/invalid-credential': 'بيانات الدخول غير صحيحة.'
  };
  return map[err.code] || ('تعذرت العملية: ' + err.message);
}

  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('newBizLat').value = pos.coords.latitude;
    document.getElementById('newBizLng').value = pos.coords.longitude;
    statusEl.innerHTML = `<span class="text-emerald-700">تم تحديد الموقع بنجاح ✓ (دقة ~${Math.round(pos.coords.accuracy)} متر)</span>`;
  }, err => {
    statusEl.textContent = 'تعذر تحديد الموقع: ' + err.message;
  }, { enableHighAccuracy: true, timeout: 15000 });
}

/* المسافة بين نقطتين جغرافيتين بالمتر (Haversine) */
function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* يتحقق من موقع الزائر مقابل موقع المحل إن كان مفعّلاً؛ يُرجع Promise<true/false> */
function verifyVisitorLocation(biz){
  if(!biz.requireLocation || !biz.lat || !biz.lng) return Promise.resolve(true);
  if(!navigator.geolocation) return Promise.resolve(false);
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(pos => {
      const dist = haversineMeters(biz.lat, biz.lng, pos.coords.latitude, pos.coords.longitude);
      resolve(dist <= (biz.locationRadius || 150));
    }, () => resolve(false), { enableHighAccuracy: true, timeout: 15000 });
  });
}

/* استدعاء المحلات المقتصرة على صاحب الحساب الحالي فقط */
function loadStoresFromFirestore(){
  if(!CURRENT_USER) return;

  db.collection(BIZ_COLLECTION_PATH).get()
    .then(snap => {
      const container = document.getElementById('myStoresContainer');
      if(!container) return;

      const allDocs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      const myStores = allDocs.filter(b => b.ownerUid === CURRENT_USER.uid);

      if(myStores.length === 0){
        container.innerHTML = `
        <div class="washi-card rounded-2xl p-12 text-center space-y-4">
          <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto">
            <i data-lucide="store" class="w-8 h-8"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-800">ليس لديك صفحة محل حتى الآن</h3>
          <p class="text-xs text-slate-500 max-w-sm mx-auto">قم بإنشاء صفحة المحل الأولى، حدد المدى الزمني وأيام الإجازات، وشاركه مع الزوار.</p>
          <button onclick="showCreateStoreModal()" class="ink-btn px-6 py-2.5 rounded-xl font-bold text-xs">
            + إنشاء المحل الآن
          </button>
        </div>`;
        lucide.createIcons();
        return;
      }

      let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-5">`;
      myStores.forEach(biz => {
        const categoryLabel = biz.category === 'restaurant' ? 'مطعم/مقهى' : biz.category === 'clinic' ? 'عيادة/مستشفى' : biz.category === 'hotel' ? 'فندق/إقامة' : 'نشاط تجاري';
        const isHidden = !!biz.hidden;
        let daysLeft = null;
        if(isHidden && biz.scheduledDeleteAt){
          daysLeft = Math.max(0, Math.ceil((new Date(biz.scheduledDeleteAt) - new Date()) / 86400000));
        }

        html += `
        <div class="washi-card rounded-2xl p-5 space-y-4 ${isHidden ? 'opacity-70 border-rose-200' : ''}">
          <div class="flex items-center gap-3">
            <img src="${biz.photoUrl || 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80'}" class="w-16 h-16 rounded-xl object-cover border border-slate-200 shadow-sm flex-shrink-0">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-bold">${categoryLabel}</span>
                ${isHidden ? `<span class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-bold">مخفي — حذف نهائي بعد ${daysLeft} يوم</span>` : ''}
              </div>
              <h3 class="text-lg font-bold text-slate-900 truncate">${esc(biz.name)}</h3>
              <div class="text-[11px] text-blue-600 font-mono font-bold truncate">yoyako.cloud/#/b/${biz.id}</div>
            </div>
          </div>

          ${isHidden ? `
            <div class="flex items-center gap-2">
              <button onclick="restoreStore('${biz.id}')" class="ink-btn flex-1 py-2 rounded-xl text-xs font-bold">استعادة الصفحة</button>
              <button onclick="permanentlyDeleteStore('${biz.id}')" class="ghost-btn flex-1 py-2 rounded-xl text-xs font-bold text-rose-600">حذف نهائي الآن</button>
            </div>
          ` : `
            <div class="flex items-center gap-2 flex-wrap">
              <button onclick="go('#/b/${biz.id}')" class="ink-btn px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> فتح صفحة الزبون
              </button>
              <button onclick="showStatsModal('${biz.id}', '${esc(biz.name).replace(/'/g,"")}')" class="ghost-btn px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1">
                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i> إحصائيات
              </button>
              <button onclick="go('#/manage/${biz.id}')" class="shu-btn px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="settings" class="w-3.5 h-3.5"></i> لوحة إدارة المحل
              </button>
            </div>
          `}
        </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      lucide.createIcons();

      // تنظيف تلقائي: حذف نهائي للمحلات المخفية التي تجاوزت مهلة الـ 30 يوماً
      const todayStr = isoDateLocal(new Date());
      myStores.filter(b => b.hidden && b.scheduledDeleteAt && b.scheduledDeleteAt <= todayStr)
        .forEach(b => db.collection(BIZ_COLLECTION_PATH).doc(b.id).delete().catch(()=>{}));
    })
    .catch(err => {
      console.error("Firestore Error:", err);
      const container = document.getElementById('myStoresContainer');
      if(container){
        container.innerHTML = `<div class="p-6 text-center text-rose-600 bg-rose-50 rounded-xl border border-rose-200 text-xs">
          خطأ في استدعاء Firestore: ${esc(err.message)}
        </div>`;
      }
    });
}

const BED_TYPE_LABELS = { single: 'مفرد', double: 'مزدوج', king: 'كينج', twin: 'سريران منفصلان' };

function loadRoomsForStore(bizId){

    const el = document.getElementById('roomsList_' + bizId);

    if(rooms.length === 0){
      el.innerHTML = `<p class="text-slate-400">لم تُضِف أي غرفة بعد. اضغط "إضافة غرفة" للبدء.</p>`;
      return;
    }

    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">` + rooms.map(r => `
      <div class="bg-white rounded-xl border border-teal-200 overflow-hidden flex">

        <div class="p-2 flex-1 min-w-0">
          <div class="font-bold text-slate-800 truncate">${esc(r.name)}</div>
          <div class="text-[10px] text-slate-500">${BED_TYPE_LABELS[r.bedType] || r.bedType} · حتى ${r.maxAdults||2} بالغين${r.maxChildren ? ' + ' + r.maxChildren + ' أطفال' : ''}</div>

            <button onclick="showRoomModal('${bizId}','${r.id}')" class="text-[10px] text-blue-600 font-bold hover:underline">تعديل</button>
            <button onclick="deleteRoom('${bizId}','${r.id}')" class="text-[10px] text-rose-600 font-bold hover:underline">حذف</button>

function showRoomModal(bizId, roomId){
  document.getElementById('roomModalBizId').value = bizId;
  document.getElementById('roomModalRoomId').value = roomId || '';
  document.getElementById('roomModalError').textContent = '';

  if(roomId){
    document.getElementById('roomModalTitle').textContent = 'تعديل الغرفة';
    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/rooms`).doc(roomId).get().then(doc => {
      if(!doc.exists){ alert('تعذر العثور على هذه الغرفة.'); return; }
      const r = doc.data();
      document.getElementById('roomName').value = r.name || '';
      document.getElementById('roomBedType').value = r.bedType || 'double';
      document.getElementById('roomPrice').value = r.price || '';
      document.getElementById('roomMaxAdults').value = r.maxAdults || 2;
      document.getElementById('roomMaxChildren').value = r.maxChildren || 0;
      document.getElementById('roomPhotoUrl').value = r.photoUrl || '';
      document.getElementById('roomModal').classList.remove('hidden');
    }).catch(err => {
      console.error('showRoomModal error:', err);
      alert('تعذر تحميل بيانات الغرفة: ' + err.message);
    });
  } else {
    document.getElementById('roomModalTitle').textContent = 'إضافة غرفة جديدة';
    document.getElementById('roomName').value = '';
    document.getElementById('roomBedType').value = 'double';
    document.getElementById('roomPrice').value = '';
    document.getElementById('roomMaxAdults').value = 2;
    document.getElementById('roomMaxChildren').value = 0;
    document.getElementById('roomPhotoUrl').value = '';
    document.getElementById('roomModal').classList.remove('hidden');
  }
}

function closeRoomModal(){ document.getElementById('roomModal').classList.add('hidden'); }

function handleRoomPhotoUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('roomPhotoUrl').value = e.target.result; };
  reader.readAsDataURL(file);

function submitSaveRoom(){
  const bizId = document.getElementById('roomModalBizId').value;
  const roomId = document.getElementById('roomModalRoomId').value;
  const name = document.getElementById('roomName').value.trim();
  const bedType = document.getElementById('roomBedType').value;
  const price = document.getElementById('roomPrice').value ? parseFloat(document.getElementById('roomPrice').value) : null;
  const maxAdults = parseInt(document.getElementById('roomMaxAdults').value) || 2;
  const maxChildren = parseInt(document.getElementById('roomMaxChildren').value) || 0;
  const photoUrl = document.getElementById('roomPhotoUrl').value.trim();

  const data = {
    name, bedType, price, maxAdults, maxChildren,
    photoUrl: photoUrl || 'https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=600&q=80',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()

  const col = db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/rooms`);

function deleteRoom(bizId, roomId){

let BOOKINGS_CACHE = { bizId: null, bookings: [] };

function loadBookingsForStore(bizId){
  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).get()
    .then(snap => {
      BOOKINGS_CACHE = { bizId, bookings: snap.docs.map(doc => ({ id: doc.id, ...doc.data() })) };
      renderBookingsTable(bizId);
    })
    .catch(err => {
      const el = document.getElementById(`bookingsList_${bizId}`);
      if(el) el.innerHTML = `<p class="text-rose-600">تعذر جلب الحجوزات: ${esc(err.message)}</p>`;
    });
}

function bookingMatchesDate(bk, dateStr){
  if(!dateStr) return true;
  if(bk.checkIn) return dateStr >= bk.checkIn && dateStr < bk.checkOut; // إقامة تغطي هذا اليوم
  if(bk.date) return bk.date === dateStr;
  if(bk.createdAt && bk.createdAt.toDate) return isoDateLocal(bk.createdAt.toDate()) === dateStr;
  return false;
}

function applyBookingsFilter(bizId){ renderBookingsTable(bizId); }
function clearBookingsFilter(bizId){
  const dateEl = document.getElementById('bkFilterDate');
  const searchEl = document.getElementById('bkFilterSearch');
  if(dateEl) dateEl.value = '';
  if(searchEl) searchEl.value = '';
  renderBookingsTable(bizId);
}

function renderBookingsTable(bizId){
  const el = document.getElementById(`bookingsList_${bizId}`);
  if(!el || BOOKINGS_CACHE.bizId !== bizId) return;

  const dateFilter = (document.getElementById('bkFilterDate') || {}).value || '';
  const searchFilter = ((document.getElementById('bkFilterSearch') || {}).value || '').trim().toLowerCase();

  let allBookings = BOOKINGS_CACHE.bookings;
  if(dateFilter) allBookings = allBookings.filter(bk => bookingMatchesDate(bk, dateFilter));
  if(searchFilter) allBookings = allBookings.filter(bk => (bk.visitorName || bk.name || '').toLowerCase().includes(searchFilter));

  // إخفاء الحجوزات المستخدمة (تم تسجيل دخول صاحبها/خدمته بالفعل)
  allBookings = allBookings.filter(bk => bk.status !== 'served');

  // ترتيب من الأقدم إلى الأحدث (الحجز/الدور التالي يظهر بعد الأقدم مباشرة)
  allBookings = allBookings.slice().sort((a, b) => {
    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
    return ta - tb;
  });

  if(allBookings.length === 0){
    el.innerHTML = `<p class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center text-slate-400">${BOOKINGS_CACHE.bookings.length === 0 ? 'لا توجد مواعيد محجوزة بعد في هذا المحل.' : 'لا توجد نتائج مطابقة لهذا الفلتر.'}</p>`;
    return;
  }

  // حساب تكرار الـ IP لكشف أي عملية إغراق وهمي
  const ipCounts = {};
  allBookings.forEach(b => {
    if(b.visitorIp) {
      ipCounts[b.visitorIp] = (ipCounts[b.visitorIp] || 0) + 1;
    }
  });

  let html = `
  <div class="overflow-x-auto">
    <table class="w-full text-right text-xs">
      <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
        <tr>
          <th class="p-3">اسم الزبون</th>
          <th class="p-3">البريد / الهاتف</th>
          <th class="p-3">التاريخ / الدور</th>
          <th class="p-3">الوقت المكون</th>
          <th class="p-3">الأشخاص</th>
          <th class="p-3">الحالة</th>
          <th class="p-3">عنوان IP الزائر</th>
          <th class="p-3 text-center">إلغاء / تخطي</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 font-medium">`;

  allBookings.forEach(bk => {
    const ip = bk.visitorIp || 'غير مسجل';
    const isRepeatedIp = ipCounts[ip] && ipCounts[ip] > 1;
    const isCancelled = bk.status === 'cancelled';
    const isSkipped = bk.status === 'skipped';
    const isQueueRow = !!bk.ticketNum;

    let statusHtml = 'مؤكد';
    let statusClass = 'text-emerald-700 font-bold';
    if(isCancelled){ statusHtml = 'ملغى'; statusClass = 'text-rose-700 font-bold'; }
    else if(isSkipped){ statusHtml = '⏰ متأخر'; statusClass = 'text-amber-700 font-bold'; }
    else if(bk.status === 'waiting'){ statusHtml = 'قيد الانتظار'; statusClass = 'text-blue-700 font-bold'; }

    html += `
      <tr class="${isCancelled ? 'opacity-50' : (isSkipped ? 'bg-amber-50/80 border-r-4 border-r-amber-500' : (isRepeatedIp ? 'bg-rose-50/80 border-r-4 border-r-rose-600' : 'hover:bg-slate-50'))}">
        <td class="p-3 font-bold text-slate-800">
          ${esc(bk.visitorName || bk.name)}
          ${isRepeatedIp ? `<span class="bg-rose-600 text-white text-[9px] px-1.5 py-0.5 rounded font-bold mr-1 block w-fit">⚠️ مكرر ${ipCounts[ip]} مرات</span>` : ''}
        </td>
        <td class="p-3 font-mono text-blue-600">${esc(bk.visitorEmail || bk.email)}</td>
        <td class="p-3 font-mono">${bk.checkIn ? (bk.checkIn + ' → ' + bk.checkOut) : (bk.date || bk.ticketNum || 'طابور')}</td>
        <td class="p-3 font-mono text-emerald-600 font-bold">${bk.roomName || bk.time || 'حضور فوري'}</td>
        <td class="p-3 font-mono text-slate-700 font-bold">${bk.guests ? `${bk.guests} أشخاص` : '1'}</td>
        <td class="p-3 font-mono ${statusClass}">${statusHtml}</td>
        <td class="p-3 font-mono ${isRepeatedIp ? 'text-rose-700 font-bold' : 'text-slate-400'}">${ip}</td>
        <td class="p-3 text-center whitespace-nowrap">
          ${!isCancelled ? `<button onclick="openEditBookingModal('${bizId}','${bk.id}')" class="text-blue-600 hover:underline">تعديل</button>` : ''}
          ${!isCancelled ? `<button onclick="cancelBookingInFirestore('${bizId}', '${bk.id}')" class="text-rose-600 hover:underline mr-2">إلغاء</button>` : '—'}
          ${(isQueueRow && !isCancelled && !isSkipped) ? `<button onclick="skipQueueBookingRow('${bizId}','${bk.id}')" class="text-amber-700 hover:underline mr-2">تخطي</button>` : ''}
        </td>
      </tr>`;
  });

  html += `</tbody></table></div>`;
  el.innerHTML = html;
}

/* =========================================================================
   إضافة حجز يدوي من لوحة صاحب المحل — بنفس تدفق صفحة الزبون:
   اختيار اليوم ← اختيار الساعة المتاحة ← إدخال التفاصيل (لنظام المواعيد)
   ========================================================================= */
let AB_STATE = { bizId: null, biz: null, date: null, time: null };
let AB_PRESET_TIME = null;

function showAddBookingModal(bizId, presetDate, presetTime){
  document.getElementById('addBookingError').textContent = '';
  const fieldsEl = document.getElementById('addBookingFields');
  fieldsEl.innerHTML = 'جاري التحميل...';
  document.getElementById('addBookingModal').classList.remove('hidden');
  AB_STATE = { bizId, biz: null, date: null, time: null };
  AB_PRESET_TIME = null;

  db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(doc => {
    if(!doc.exists){ alert('تعذر العثور على بيانات المحل.'); return; }
    AB_STATE.biz = { id: doc.id, ...doc.data() };
    if(presetDate && AB_STATE.biz.mode !== 'queue' && AB_STATE.biz.category !== 'hotel'){
      AB_STATE.date = presetDate;
      if(presetTime) AB_PRESET_TIME = presetTime;
    }
    renderAddBookingStep();
  }).catch(err => {
    console.error('showAddBookingModal error:', err);
    alert('تعذر تحميل بيانات المحل: ' + err.message);
  });
}

function renderAddBookingStep(){
  const biz = AB_STATE.biz;
  const fieldsEl = document.getElementById('addBookingFields');
  if(!biz || !fieldsEl) return;

  if(biz.category === 'hotel'){ renderAddBookingHotelForm(); return; }
  if(biz.mode === 'queue'){ renderAddBookingQueueForm(); return; }

  // نظام المواعيد: نفس تدفق الزبون بالضبط — يوم ثم ساعة ثم تفاصيل
  if(!AB_STATE.date){ renderAddBookingDayPicker(); return; }
  if(!AB_STATE.time){ renderAddBookingTimePicker(); return; }
  renderAddBookingDetailsForm();
}

function renderAddBookingDayPicker(){
  const biz = AB_STATE.biz;
  const fieldsEl = document.getElementById('addBookingFields');
  const days = nextAvailableDays(biz.maxAdvanceDays !== undefined ? biz.maxAdvanceDays : 14);
  const closedDays = biz.closedDays || [];
  const enableJapanHolidays = biz.enableJapanHolidays !== false;

  fieldsEl.innerHTML = `
    <div class="text-xs font-bold text-slate-700 mb-1">الخطوة 1: اختر اليوم</div>
    <div class="flex gap-2 overflow-x-auto pb-2">
      ${days.map(d => {
        const isWeeklyClosed = closedDays.includes(d.weekday);
        const holidayName = enableJapanHolidays ? checkJapanHoliday(d.date) : null;
        if(isWeeklyClosed || holidayName){
          return `<div class="day-chip disabled"><div class="text-[10px] text-slate-400">${d.label.split(' ')[0]}</div><div class="font-bold text-[10px] mt-0.5 text-rose-500">${holidayName ? 'عطلة' : 'إجازة'}</div></div>`;
        }
        return `<div class="day-chip" onclick="selectAddBookingDate('${d.date}')"><div class="text-[10px] text-slate-500">${d.label.split(' ')[0]}</div><div class="font-bold text-xs mt-0.5">${d.label.split(' ').slice(1).join(' ')}</div></div>`;
      }).join('')}
    </div>`;
}

function selectAddBookingDate(date){
  AB_STATE.date = date;
  AB_STATE.time = null;
  renderAddBookingStep();
}

function renderAddBookingTimePicker(){
  const biz = AB_STATE.biz;
  const bizId = AB_STATE.bizId;
  const fieldsEl = document.getElementById('addBookingFields');
  const schedule = biz.schedule || { startTime: '11:00', endTime: '21:00', slotDuration: 30 };
  const allSlots = generateSlots(schedule);

  fieldsEl.innerHTML = `<div class="text-xs text-slate-400">جاري تحميل الأوقات المتاحة...</div>`;

  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).get().then(snap => {
    const taken = snap.docs.map(d => d.data())
      .filter(b => b.date === AB_STATE.date && b.status === 'confirmed')
      .map(b => b.time);

    // إذا جاء المستخدم من "عرض الساعات" وضغط على ساعة متاحة، انتقل مباشرة لخطوة التفاصيل
    // بعد التأكد أنها ما زالت متاحة فعلياً (فحص حي بدل الاعتماد على بيانات قديمة)
    if(AB_PRESET_TIME && !taken.includes(AB_PRESET_TIME)){
      const t = AB_PRESET_TIME;
      AB_PRESET_TIME = null;
      selectAddBookingTime(t);
      return;
    }
    AB_PRESET_TIME = null;

    fieldsEl.innerHTML = `
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-700">الخطوة 2: اختر الساعة — ${AB_STATE.date}</span>

          ? `<div class="slot-btn taken">${t}</div>`
          : `<div class="slot-btn" onclick="selectAddBookingTime('${t}')">${t}</div>`
        ).join('')}
      </div>`;
  });
}

function submitManualBooking(){
  const bizId = AB_STATE.bizId;
  const biz = AB_STATE.biz;
  const errEl = document.getElementById('addBookingError');
  const name = document.getElementById('abName').value.trim();
  const email = document.getElementById('abEmail').value.trim();
  if(!name){ errEl.textContent = 'يرجى كتابة اسم الزبون على الأقل.'; return; }

  const token = uidToken('tok');
  const bookingsCol = db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`);
  let data = { visitorName: name, visitorEmail: email, visitorIp: 'يدوي (من لوحة صاحب المحل)', status: 'confirmed', cancelToken: token, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
  let docId;
  let ticketNumPromise = Promise.resolve(null);

  if(biz.category === 'hotel'){
    const roomSel = document.getElementById('abRoom');
    const checkIn = document.getElementById('abCheckIn').value;
    const checkOut = document.getElementById('abCheckOut').value;
    if(!roomSel.value || !checkIn || !checkOut){ errEl.textContent = 'يرجى إكمال بيانات الغرفة والتواريخ.'; return; }
    data.roomId = roomSel.value;
    data.roomName = roomSel.selectedOptions[0].dataset.name || '';
    data.checkIn = checkIn; data.checkOut = checkOut;
    data.adults = parseInt(document.getElementById('abAdults').value) || 1;
    data.children = parseInt(document.getElementById('abChildren').value) || 0;
    docId = 'stay_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36);
  } else if(biz.mode === 'queue'){
    data.status = 'waiting';
    data.guests = parseInt(document.getElementById('abGuests').value) || 1;
    docId = 'ticket_manual_' + Math.random().toString(36).slice(2,9);
    ticketNumPromise = getNextQueueNumber(bizId);
  } else {
    if(!AB_STATE.date || !AB_STATE.time){ errEl.textContent = 'يرجى اختيار اليوم والساعة أولاً.'; return; }
    data.date = AB_STATE.date; data.time = AB_STATE.time;
    const guestsEl = document.getElementById('abGuests');
    if(guestsEl) data.guests = parseInt(guestsEl.value) || 1;
    const birthdateEl = document.getElementById('abBirthdate');
    if(birthdateEl) data.visitorBirthdate = birthdateEl.value || null;
    docId = AB_STATE.date + '_' + AB_STATE.time.replace(':', '-');
  }

  ticketNumPromise.then(ticketNum => {
    if(ticketNum) data.ticketNum = ticketNum;
    return bookingsCol.doc(docId).set(data);
  }).then(() => {
    closeAddBookingModal();
    loadBookingsForStore(bizId);
  }).catch(err => {
    errEl.textContent = 'تعذر حفظ الحجز: ' + err.message;
  });
}

   نافذة إحصائيات الحجوزات (اليوم / هذا الشهر / مدى مخصص) لمحل واحد
   ========================================================================= */
/* حدود حقل التاريخ (بحث/إضافة حجز) بحيث لا تتجاوز المدى الزمني الذي حدده صاحب المحل */
function bkDateInputAttrs(biz){
  const today = isoDateLocal(new Date());
  const maxDays = biz.maxAdvanceDays !== undefined ? biz.maxAdvanceDays : 14;
  const maxDate = isoDateLocal(new Date(Date.now() + Math.max(0, maxDays) * 86400000));
  return `min="${today}" max="${maxDate}"`;
}

function bookingRefDateStr(b){
  // تاريخ الحجز المرجعي للإحصاء: تاريخ الموعد أو تاريخ الوصول للفندق، وإلا تاريخ الإنشاء
  if(b.date) return b.date; // appointment
  if(b.checkIn) return b.checkIn; // hotel
  if(b.createdAt && b.createdAt.toDate) return isoDateLocal(b.createdAt.toDate()); // queue/fallback
  return null;
}

function showStatsModal(bizId, bizName){
  const modal = document.getElementById('statsModal');

  if(!modal) return;

    const bookings = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.status !== 'cancelled');

  }).catch(err => {

}

let STATS_CACHE = { bizId: null, bookings: [] };

function renderStatsBody(){
  const body = document.getElementById('statsModalBody');
  if(!body || !STATS_CACHE.bizId) return;

  const todayStr = isoDateLocal(new Date());
  const now = new Date();
  const monthPrefix = todayStr.slice(0, 7); // YYYY-MM

  const todayCount = STATS_CACHE.bookings.filter(b => bookingRefDateStr(b) === todayStr).length;
  const monthCount = STATS_CACHE.bookings.filter(b => { const d = bookingRefDateStr(b); return d && d.startsWith(monthPrefix); }).length;

  body.innerHTML = `
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-blue-50 rounded-xl p-3 text-center border border-blue-100">
        <div class="text-2xl font-extrabold text-blue-600 font-mono">${todayCount}</div>
        <div class="text-[11px] text-slate-500 font-bold">حجوزات اليوم</div>
      </div>
      <div class="bg-emerald-50 rounded-xl p-3 text-center border border-emerald-100">
        <div class="text-2xl font-extrabold text-emerald-600 font-mono">${monthCount}</div>
        <div class="text-[11px] text-slate-500 font-bold">حجوزات هذا الشهر</div>
      </div>
    </div>
    <div class="border-t border-slate-200 pt-3 space-y-2">
      <label class="text-xs font-bold text-slate-600 block">اختر مدى تاريخ مخصص:</label>
      <div class="grid grid-cols-2 gap-2">
        <input id="statsFromDate" type="date" class="rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
        <input id="statsToDate" type="date" class="rounded-lg px-2.5 py-1.5 text-xs border border-slate-300">
      </div>
      <button onclick="calcCustomRangeStats()" class="ink-btn w-full py-2 rounded-lg text-xs font-bold">احسب عدد الحجوزات في هذا المدى</button>
      <div id="statsCustomResult" class="text-xs font-bold text-center pt-1"></div>
    </div>
    <div class="text-[10px] text-slate-400 pt-2 border-t border-slate-200">إجمالي الحجوزات المؤكدة (غير الملغاة): ${STATS_CACHE.bookings.length}</div>
  `;
}

function calcCustomRangeStats(){
  const from = document.getElementById('statsFromDate').value;
  const to = document.getElementById('statsToDate').value;
  const resultEl = document.getElementById('statsCustomResult');
  if(!from || !to){ resultEl.textContent = 'يرجى اختيار تاريخي البداية والنهاية.'; return; }
  if(from > to){ resultEl.textContent = 'تاريخ البداية يجب أن يكون قبل النهاية.'; return; }

  const count = STATS_CACHE.bookings.filter(b => {
    const d = bookingRefDateStr(b);
    return d && d >= from && d <= to;
  }).length;

  resultEl.innerHTML = `<span class="text-indigo-600">عدد الحجوزات من ${from} إلى ${to}: ${count}</span>`;
}

/* حفظ المحل مع التحقق القاطع من حصرية الـ Slug */
/* التحقق الفوري من توفر الـ Slug أثناء الكتابة (مع مهلة زمنية حتى لا يتجمد التحقق) */
function onSlugInputChange(){
  const statusEl = document.getElementById('slugStatusLine');
  const editId = document.getElementById('editBizId').value;
  let slug = document.getElementById('newBizSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');

  if(SLUG_CHECK_TIMER) clearTimeout(SLUG_CHECK_TIMER);

  if(!slug){
    SLUG_CHECK_STATE = { value: null, available: null, checking: false };
    if(statusEl) statusEl.innerHTML = '';
    return;
  }

  // إذا كنا في وضع التعديل ولم يتغير الـ Slug عن قيمته الأصلية، فهو متاح تلقائياً
  if(editId && slug === editId){
    SLUG_CHECK_STATE = { value: slug, available: true, checking: false };
    if(statusEl) statusEl.innerHTML = `<span class="text-emerald-600">✓ هذا هو رابط محلك الحالي</span>`;
    return;
  }

  if(statusEl) statusEl.innerHTML = `<span class="text-slate-400">جاري التحقق من التوفر...</span>`;
  SLUG_CHECK_STATE = { value: slug, available: null, checking: true };

  SLUG_CHECK_TIMER = setTimeout(() => {
    checkSlugAvailability(slug);
  }, 400);
}

function withTimeout(promise, ms, timeoutMsg){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(timeoutMsg || 'انتهت مهلة الاتصال بـ Firebase')), ms))
  ]);
}

async function checkSlugAvailability(slug){
  const statusEl = document.getElementById('slugStatusLine');
  try {
    const doc = await withTimeout(
      db.collection(BIZ_COLLECTION_PATH).doc(slug).get(),
      8000,
      'انتهت مهلة الاتصال بـ Firebase أثناء التحقق من الرابط.'
    );

    // تجاهل النتيجة إذا تغيّر النص في الحقل أثناء الانتظار
    const currentSlug = document.getElementById('newBizSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    if(currentSlug !== slug) return;

    if(doc.exists){
      SLUG_CHECK_STATE = { value: slug, available: false, checking: false };
      if(statusEl) statusEl.innerHTML = `<span class="text-rose-600">✗ هذا الرابط محجوز بالفعل، جرّب: ${esc(slug)}-shibuya</span>`;
    } else {
      SLUG_CHECK_STATE = { value: slug, available: true, checking: false };
      if(statusEl) statusEl.innerHTML = `<span class="text-emerald-600">✓ الرابط متاح</span>`;
    }
  } catch(e) {
    console.error("Slug check error:", e);
    SLUG_CHECK_STATE = { value: slug, available: null, checking: false, error: e.message };
    if(statusEl) statusEl.innerHTML = `<span class="text-amber-600">⚠ تعذر التحقق (${esc(e.message)}) — سيُعاد التحقق عند الحفظ</span>`;
  }
}

async function submitSaveStore(){
  if(!CURRENT_USER) return;
  const editId = document.getElementById('editBizId').value;
  const name = document.getElementById('newBizName').value.trim();
  const category = document.getElementById('newBizCategory').value;
  let rawSlug = document.getElementById('newBizSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  const mode = document.getElementById('newBizMode').value;
  const maxAdvanceDays = parseInt(document.getElementById('newBizMaxAdvance').value);
  const seatsCount = parseInt(document.getElementById('newBizSeats').value) || 1;
  const maxGuests = parseInt(document.getElementById('newBizMaxGuests').value) || 4;
  const desc = document.getElementById('newBizDesc').value.trim();
  const address = document.getElementById('newBizAddress').value.trim();
  const phone = document.getElementById('newBizPhone').value.trim();
  const email = document.getElementById('newBizEmail').value.trim();
  const socialUrl = document.getElementById('newBizSocial').value.trim();
  const googleMapsUrl = document.getElementById('newBizGoogleMaps').value.trim();
  const lineUrl = document.getElementById('newBizLine').value.trim();
  const photoUrl = document.getElementById('newBizPhotoUrl').value.trim();
  const start = document.getElementById('newBizStart').value;
  const end = document.getElementById('newBizEnd').value;
  const breakStart = document.getElementById('newBizBreakStart').value;
  const breakEnd = document.getElementById('newBizBreakEnd').value;
  const slot = document.getElementById('newBizSlot').value;
  const avgService = parseInt(document.getElementById('newBizAvgService').value) || 20;
  const enableJapanHolidays = document.getElementById('newBizJapanHolidays').checked;
  const requireBirthdate = document.getElementById('newBizRequireBirthdate').checked;
  const allowQueueFallback = document.getElementById('newBizAllowQueueFallback').checked;
  const requireLocation = document.getElementById('newBizRequireLocation').checked;
  const lat = document.getElementById('newBizLat').value ? parseFloat(document.getElementById('newBizLat').value) : null;
  const lng = document.getElementById('newBizLng').value ? parseFloat(document.getElementById('newBizLng').value) : null;
  const locationRadius = parseInt(document.getElementById('newBizLocationRadius').value) || 150;
  const errEl = document.getElementById('saveStoreError');
  const saveBtn = document.getElementById('stepSaveBtn');

  if(requireLocation && (!lat || !lng)){
    errEl.textContent = 'فعّلت التحقق من الموقع لكن لم تحدد موقع المحل بعد. اضغط "تحديد موقع المحل الحالي" في الخطوة 3 أولاً.';
    return;
  }

  if(!name){ errEl.textContent = 'يرجى كتابة اسم المحل.'; return; }
  
  if(!rawSlug) {
    rawSlug = 'shop-' + Math.floor(100 + Math.random() * 900);
  }

  const bizId = editId || rawSlug;
  const slugChanged = !editId || editId !== bizId;

  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'جاري الحفظ...'; }

  if(slugChanged){
    // استخدم نتيجة التحقق الفوري إن كانت متوفرة لنفس القيمة الحالية بدلاً من التحقق من جديد
    if(SLUG_CHECK_STATE.value === bizId && SLUG_CHECK_STATE.available === false){
      errEl.textContent = `عذراً! اسم الرابط (${bizId}) محجوز بالفعل لمحل آخر. يرجى اختيار اسم آخر مثل: ${bizId}-shibuya`;
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'حفظ ونشر الصفحة'; }
      return;
    }

    if(SLUG_CHECK_STATE.value !== bizId || SLUG_CHECK_STATE.available !== true){
      errEl.textContent = 'جاري التحقق من حصرية اسم الرابط في Firebase...';
      try {
        const existingDoc = await withTimeout(
          db.collection(BIZ_COLLECTION_PATH).doc(bizId).get(),
          8000,
          'انتهت مهلة الاتصال بـ Firebase. تحقق من اتصالك بالإنترنت أو من قواعد صلاحيات Firestore.'
        );
        if (existingDoc.exists) {
          errEl.textContent = `عذراً! اسم الرابط (${bizId}) محجوز بالفعل لمحل آخر. يرجى اختيار اسم آخر مثل: ${bizId}-shibuya`;
          if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'حفظ ونشر الصفحة'; }
          return;
        }
      } catch(e) {
        console.warn("Slug check failed:", e);
        errEl.textContent = 'تعذر التحقق من توفر الرابط: ' + e.message + ' — سيُحاول الحفظ مباشرة الآن.';
      }
    }
  }

  errEl.textContent = 'جاري حفظ صفحة المحل في Firestore...';

  const closedDays = [];
  document.querySelectorAll('.closed-day-cb:checked').forEach(cb => {
    closedDays.push(parseInt(cb.value));
  });

  db.collection(BIZ_COLLECTION_PATH).doc(bizId).set({
    ownerUid: CURRENT_USER.uid,
    ownerEmail: CURRENT_USER.email || null,
    name: name,
    category: category,
    mode: mode,
    maxAdvanceDays: maxAdvanceDays,
    maxGuests: maxGuests,
    seatsCount: seatsCount,
    description: desc || 'صفحة حجز سحابية عبر Yoyako.cloud',
    address: address,
    phone: phone,
    email: email,
    socialUrl: socialUrl,
    googleMapsUrl: googleMapsUrl,
    lineUrl: lineUrl,
    photoUrl: photoUrl || 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80',
    schedule: { startTime: start, endTime: end, breakStart: breakStart, breakEnd: breakEnd, slotDuration: parseInt(slot) },
    closedDays: closedDays,
    enableJapanHolidays: enableJapanHolidays,
    avgServiceMinutes: avgService,
    requireBirthdate: requireBirthdate,
    allowQueueFallback: allowQueueFallback,
    requireLocation: requireLocation,
    lat: lat,
    lng: lng,
    locationRadius: locationRadius,
    ...(editId ? {} : { widget: { type: 'button', position: 'bottom-right', color: '#dc2626', buttonText: 'احجز الآن' } }),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(() => {
    errEl.textContent = '';
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'حفظ ونشر الصفحة'; }
    showPublishStep(bizId);
  }).catch(err => {
    errEl.textContent = "تعذر حفظ المحل في Firebase: " + err.message;
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'حفظ ونشر الصفحة'; }
  });
}

/* الحذف يخفي الصفحة عن الزوار فوراً فقط؛ الحذف النهائي من قاعدة البيانات يتم تلقائياً بعد 30 يوماً
   (أو فوراً عبر زر "حذف نهائي الآن") — لا يوجد سيرفر خلفي هنا، لذا يتم التنظيف الفعلي عند
   تحميل لوحة التحكم أو لوحة المدير لأي محل تجاوز موعد حذفه المجدول. */
function deleteStore(bizId){
  if(!confirm('سيتم إخفاء صفحة هذا المحل عن الزوار فوراً، وستُحذف نهائياً من قاعدة البيانات تلقائياً بعد 30 يوماً. هل تريد المتابعة؟')) return;
  const scheduledDeleteAt = isoDateLocal(new Date(Date.now() + 30 * 86400000));
  db.collection(BIZ_COLLECTION_PATH).doc(bizId).set({
    hidden: true,
    hiddenAt: firebase.firestore.FieldValue.serverTimestamp(),
    scheduledDeleteAt: scheduledDeleteAt
  }, { merge: true }).then(() => {
    go('#/');
  });
}

function restoreStore(bizId){
  db.collection(BIZ_COLLECTION_PATH).doc(bizId).set({
    hidden: false, scheduledDeleteAt: null
  }, { merge: true }).then(() => {
    loadStoresFromFirestore();
  });
}

function permanentlyDeleteStore(bizId){
  if(!confirm('هذا حذف نهائي فوري ولا يمكن التراجع عنه. هل أنت متأكد؟')) return;
  db.collection(BIZ_COLLECTION_PATH).doc(bizId).delete().then(() => {
    loadStoresFromFirestore();
  });
}

function cancelBookingInFirestore(bizId, bookingDocId){
  if(confirm('هل تريد إلغاء هذا الحجز وإتاحة الوقت مجدداً؟')){
    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingDocId)
      .update({ status: 'cancelled', cancelledAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => {
        loadBookingsForStore(bizId);
      });
  }
}

function renderPublicBooking(bizId){

  const stored = getLocalBooking(bizId);
  if(stored && stored.docId && stored.token){
    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(stored.docId).get().then(snap => {
      if(snap.exists && snap.data().status !== 'cancelled'){
        go('#/ticket/' + bizId + '/' + stored.docId + '/' + stored.token);
      } else {
        clearLocalBooking(bizId);
        renderPublicBookingForm(bizId);

function onHotelDatesChange(bizId){
  const checkIn = document.getElementById('hotelCheckIn').value;
  const checkOut = document.getElementById('hotelCheckOut').value;
  const msgEl = document.getElementById('hotelDatesMsg');
  const formBlock = document.getElementById('hotelFormBlock');
  if(formBlock) formBlock.innerHTML = '';
  if(!checkIn || !checkOut) return;

  if(checkOut <= checkIn){
    msgEl.textContent = 'تاريخ المغادرة يجب أن يكون بعد تاريخ الوصول.';
    return;
  }
  msgEl.textContent = 'جاري التحقق من توفر الغرفة في هذا المدى...';

  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).get().then(snap => {
    const overlapping = snap.docs.map(d => d.data()).some(b =>
      b.status === 'confirmed' && b.roomId === HOTEL_SELECTED_ROOM.id &&
      b.checkIn < checkOut && checkIn < b.checkOut
    );
    if(overlapping){
      msgEl.textContent = 'عذراً، هذه الغرفة محجوزة بالفعل في جزء من هذا المدى الزمني. جرّب تواريخ أخرى أو غرفة أخرى.';
      return;
    }
    msgEl.textContent = '';
    paintHotelForm(bizId, checkIn, checkOut);
  }).catch(err => {
    msgEl.textContent = 'تعذر التحقق من التوفر: ' + err.message;
  });

function submitHotelBooking(bizId, checkIn, checkOut){
  if(getLocalBooking(bizId)){ go('#/b/' + bizId); return; }

  const name = document.getElementById('hName').value.trim();
  const email = document.getElementById('hEmail').value.trim();
  const adults = parseInt(document.getElementById('hAdults').value) || 1;
  const children = parseInt(document.getElementById('hChildren').value) || 0;
  const errEl = document.getElementById('hotelBookError');
  const room = HOTEL_SELECTED_ROOM;

  if(!name || !email){
    errEl.textContent = 'يرجى إدخال اسمك وبريدك الإلكتروني.';
    return;
  }

  errEl.textContent = 'جاري التحقق من موقعك وتوفر الغرفة...';
  const bookingsCol = db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`);
  const token = uidToken('tok');

  db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(bizDocForLoc => {
    const bizForLoc = { id: bizDocForLoc.id, ...bizDocForLoc.data() };
    return verifyVisitorLocation(bizForLoc);
  }).then(ok => {
    if(!ok){
      errEl.textContent = 'تعذر تأكيد أنك بالقرب من موقع الفندق. هذا الفندق يتطلب أن تكون في موقعه الفعلي لإتمام الحجز.';
      return;
    }
    errEl.textContent = 'جاري التحقق النهائي من توفر الغرفة وتأكيد الحجز...';

    bookingsCol.get().then(snap => {
    const overlapping = snap.docs.map(d => d.data()).some(b =>
      b.status === 'confirmed' && b.roomId === room.id &&
      b.checkIn < checkOut && checkIn < b.checkOut
    );
    if(overlapping){
      errEl.textContent = 'عذراً، تم حجز هذه الغرفة للتو من زائر آخر لنفس المدى. جرّب تواريخ أو غرفة أخرى.';
      return;
    }

    const docId = 'stay_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36);
    return bookingsCol.doc(docId).set({
      visitorName: name,
      visitorEmail: email,
      roomId: room.id,
      roomName: room.name,
      adults, children,
      checkIn, checkOut,
      visitorIp: USER_IP_ADDRESS,
      status: 'confirmed',
      cancelToken: token,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      return db.collection(BIZ_COLLECTION_PATH).doc(bizId).get();
    }).then(bizDoc => {
      const biz = { id: bizDoc.id, ...bizDoc.data() };
      sendConfirmationEmail(biz, docId, token, name, email, checkIn + ' → ' + checkOut, room.name);
      setLocalBooking(bizId, docId, token);
      go('#/ticket/' + bizId + '/' + docId + '/' + token);
    });
  }).catch(err => {
    errEl.textContent = 'تعذر الحجز: ' + err.message;
  });
  });
}

function paintSlotsBlockFromFirestore(biz){
  const schedule = biz.schedule || { startTime: '11:00', endTime: '21:00', slotDuration: 30 };
  const allSlots = generateSlots(schedule);
  const container = document.getElementById('slotsBlock');
  if(!container) return;

  db.collection(`${BIZ_COLLECTION_PATH}/${biz.id}/bookings`).get()
    .then(snap => {
      const allBookings = snap.docs.map(doc => doc.data());
      const takenTimes = allBookings
        .filter(b => b.date === PUBLIC_SELECTED_DATE && b.status === 'confirmed')
        .map(b => b.time);

      const allTaken = allSlots.length > 0 && allSlots.every(t => takenTimes.includes(t));

      container.innerHTML = `
      <div class="washi-card rounded-2xl p-5 space-y-3 fade-in">
        <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center font-bold">2</span>
          <span>اختر الوقت المتاح (الأوقات بالرمادي محجوزة)</span>
        </h3>

        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
          ${allSlots.map(t => {
            const isTaken = takenTimes.includes(t);
            const isActive = PUBLIC_SELECTED_TIME === t;

            if(isTaken){
              return `<div class="slot-btn taken" title="محجوز بالكامل">${t} <span class="text-[9px] block">محجوز ✕</span></div>`;
            } else {
              return `<div class="slot-btn ${isActive ? 'active' : ''}" onclick="selectPublicTime('${biz.id}', '${t}')">${t}</div>`;
            }
          }).join('')}
        </div>

        ${(allTaken && biz.allowQueueFallback) ? `
          <div class="bg-cyan-50 border border-cyan-200 rounded-xl p-3 text-center space-y-2">
            <p class="text-xs text-cyan-800 font-bold">كل الأوقات محجوزة في هذا اليوم، لكن يمكنك الانضمام لقائمة انتظار وسنتواصل معك إذا توفر وقت.</p>

          </div>
        ` : ''}
      </div>`;

      paintFormBlock(biz);
    });
}

function submitBookingToFirestore(bizId){
  if(getLocalBooking(bizId)){
    go('#/b/' + bizId);
    return;
  }
  const name = document.getElementById('vName').value.trim();
  const email = document.getElementById('vEmail').value.trim();
  const guestsEl = document.getElementById('vGuests');
  const guests = guestsEl ? parseInt(guestsEl.value) : 1;
  const birthdateEl = document.getElementById('vBirthdate');
  const birthdate = birthdateEl ? birthdateEl.value : null;
  const errEl = document.getElementById('bookError');

  if(!name || !email){
    errEl.textContent = 'يرجى إدخال اسمك وبريدك الإلكتروني.';
    return;
  }
  if(birthdateEl && !birthdate){
    errEl.textContent = 'يرجى إدخال تاريخ الميلاد المطلوب من هذه العيادة.';
    return;
  }

  errEl.textContent = 'جاري التحقق من موقعك وتأكيد الحجز...';

  db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(bizDoc => {
    const biz = { id: bizDoc.id, ...bizDoc.data() };
    return verifyVisitorLocation(biz).then(ok => {
      if(!ok){
        errEl.textContent = 'تعذر تأكيد أنك بالقرب من موقع المحل. هذا المحل يتطلب أن تكون في موقعه الفعلي لإتمام الحجز.';
        return;
      }
      errEl.textContent = 'جاري التحقق من الموعد وقفله وتسجيل عنوان الـ IP...';
      submitBookingToFirestoreConfirmed(bizId, name, email, guests, birthdate);
    });
  }).catch(err => { errEl.textContent = 'تعذر التحقق: ' + err.message; });
}

function submitBookingToFirestoreConfirmed(bizId, name, email, guests, birthdate){
  const errEl = document.getElementById('bookError');
  const date = PUBLIC_SELECTED_DATE, time = PUBLIC_SELECTED_TIME;
  const docId = date + '_' + time.replace(':', '-');
  const token = uidToken('tok');
  const bookingRef = db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(docId);

  db.runTransaction(transaction => {
    return transaction.get(bookingRef).then(doc => {
      if(doc.exists && doc.data().status === 'confirmed'){
        throw new Error("SLOT_TAKEN");
      }
      transaction.set(bookingRef, {
        visitorName: name,
        visitorEmail: email,
        guests: guests,
        visitorBirthdate: birthdate || null,
        visitorIp: USER_IP_ADDRESS, // حفظ بصمة الـ IP لحماية المحل من الحجوزات المكررة
        date: date,
        time: time,
        status: 'confirmed',
        cancelToken: token,
        bookingLink: buildTicketLink(bizId, docId, token),
        fcmToken: getStoredFcmToken ? getStoredFcmToken() : null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
  }).then(() => {
    return db.collection(BIZ_COLLECTION_PATH).doc(bizId).get();
  }).then(bizDoc => {
    const biz = { id: bizDoc.id, ...bizDoc.data() };
    sendConfirmationEmail(biz, docId, token, name, email, date, time);
    setLocalBooking(bizId, docId, token);
    notifyBookingCreatedPush(biz, 'تم تأكيد حجزك', `حجزك في ${biz.name || 'المحل'} يوم ${date} الساعة ${time}`, '#/ticket/' + bizId + '/' + docId + '/' + token);
    go('#/ticket/' + bizId + '/' + docId + '/' + token);
  }).catch(err => {
    if(err.message === "SLOT_TAKEN"){
      errEl.textContent = 'عذراً، قام شخص آخر بحجز هذا الموعد في نفس اللحظة! يرجى اختيار وقت آخر.';
      paintSlotsBlockFromFirestore({ id: bizId, schedule: null }); // will re-fetch schedule via caller normally
      db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(d => paintSlotsBlockFromFirestore({ id: d.id, ...d.data() }));
    } else {
      errEl.textContent = 'تعذر الحجز في Firebase: ' + err.message;
    }
  });
}

function paintQueueSection(biz){
  const container = document.getElementById('queueSection');
  if(!container) return;

  db.collection(`${BIZ_COLLECTION_PATH}/${biz.id}/bookings`).get().then(snap => {
    const waitingList = snap.docs.map(doc => doc.data()).filter(b => b.status === 'waiting');
    const avgService = biz.avgServiceMinutes || 20;
    const seatsCount = biz.seatsCount || 1;
    const estWaitMinutes = Math.ceil(waitingList.length / seatsCount) * avgService;

    const maxG = biz.maxGuests || 4;

function submitQueueTicket(bizId, waitingCount){
  if(getLocalBooking(bizId)){
    go('#/b/' + bizId);
    return;
  }
  const name = document.getElementById('qName').value.trim();
  const email = document.getElementById('qEmail').value.trim();
  const guests = document.getElementById('qGuests').value;

  if(!name || !email){
    alert('يرجى كتابة الاسم والبريد الإلكتروني.');
    return;
  }

  db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(bizDoc0 => {
    const bizForLocation = { id: bizDoc0.id, ...bizDoc0.data() };
    return verifyVisitorLocation(bizForLocation);
  }).then(ok => {
    if(!ok){
      alert('تعذر تأكيد أنك بالقرب من موقع المحل. هذا المحل يتطلب أن تكون في موقعه الفعلي للانضمام للطابور.');
      return;
    }

    const docId = 'ticket_' + Math.floor(1000 + Math.random() * 9000);
    const token = uidToken('tok');

    getNextQueueNumber(bizId).then(ticketNum => {
      return db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(docId).set({
        ticketNum: ticketNum,
        visitorName: name,
        visitorEmail: email,
        guests: guests,
        visitorIp: USER_IP_ADDRESS,
        status: 'waiting',
        cancelToken: token,
        bookingLink: buildTicketLink(bizId, docId, token),
        fcmToken: getStoredFcmToken ? getStoredFcmToken() : null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        return db.collection(BIZ_COLLECTION_PATH).doc(bizId).get();
      }).then(bizDoc => {
        const biz = { id: bizDoc.id, ...bizDoc.data() };
        sendConfirmationEmail(biz, docId, token, name, email, ticketNum, guests + ' أشخاص');
        setLocalBooking(bizId, docId, token);
        notifyBookingCreatedPush(biz, 'تم سحب دورك', `دورك في ${biz.name || 'المحل'} هو رقم ${ticketNum}`, '#/ticket/' + bizId + '/' + docId + '/' + token);
        go('#/ticket/' + bizId + '/' + docId + '/' + token);
      });
    });
  });
}

/* بناء رابط تسجيل الدخول عبر LINE Login وربط حساب العميل بهذا الحجز تحديداً */
function connectLineForBooking(bizId, bookingDocId, token){
  db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(doc => {
    if(!doc.exists) return;
    const biz = { id: doc.id, ...doc.data() };
    if(!biz.lineLoginChannelId || !biz.lineFunctionUrl){
      alert('لم يقم صاحب المحل بإعداد الربط مع LINE Login بعد.');
      return;
    }
    const returnUrl = buildTicketLink(bizId, bookingDocId, token);
    const state = encodeURIComponent(btoa(JSON.stringify({ bizId, docId: bookingDocId, returnUrl })));
    const redirectUri = encodeURIComponent(biz.lineFunctionUrl + '?action=callback');
    const authUrl = `https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=${encodeURIComponent(biz.lineLoginChannelId)}&redirect_uri=${redirectUri}&state=${state}&scope=${encodeURIComponent('profile openid')}&bot_prompt=aggressive`;
    location.href = authUrl;
  });
}

/* إرسال رسالة LINE مرتبطة بحدث معيّن (onCreate / reminder / turn) حسب إعدادات صاحب المحل */
function sendLineMessageForEvent(bizId, bookingDocId, eventType){
  Promise.all([
    db.collection(BIZ_COLLECTION_PATH).doc(bizId).get(),
    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingDocId).get()
  ]).then(([bizDoc, bkDoc]) => {
    if(!bizDoc.exists || !bkDoc.exists) return;
    const biz = { id: bizDoc.id, ...bizDoc.data() };
    const bk = bkDoc.data();
    if(!biz.lineEnabled || !biz.lineFunctionUrl || !bk.lineUserId) return;

    const cfg = (biz.lineMessages && biz.lineMessages[eventType]) || {};
    if(!cfg.enabled || !cfg.template) return;

    const text = cfg.template
      .replace(/{name}/g, bk.visitorName || bk.name || '')
      .replace(/{bizName}/g, biz.name || '')
      .replace(/{date}/g, bk.date || '')
      .replace(/{time}/g, bk.time || '')
      .replace(/{ticketNum}/g, bk.ticketNum || '')
      .replace(/{link}/g, bk.bookingLink || '');

    fetch(biz.lineFunctionUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bizId, lineUserId: bk.lineUserId, message: text })
    }).catch(err => console.error('تعذر إرسال رسالة LINE:', err));
  });
}

/* حساب عدد الأشخاص أمام هذه التذكرة ووقت الانتظار المتوقع، مع مراعاة عدد المقاعد المتزامنة */
function loadQueuePosition(bizId, bookingDocId){
  const block = document.getElementById('queuePositionBlock');
  if(!block) return;

  Promise.all([
    db.collection(BIZ_COLLECTION_PATH).doc(bizId).get(),
    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).get()
  ]).then(([bizDoc, snap]) => {
    if(!bizDoc.exists) return;
    const biz = bizDoc.data();
    const avgService = biz.avgServiceMinutes || 20;
    const seatsCount = biz.seatsCount || 1;

    const waiting = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(b => b.status === 'waiting')
      .sort((a, b) => {
        const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return ta - tb;
      });

    const myIndex = waiting.findIndex(b => b.id === bookingDocId);
    if(myIndex === -1){
      block.innerHTML = `<div class="text-xs text-emerald-700 font-bold">دورك الآن! يرجى التوجه للاستقبال 🎉</div>`;
      return;
    }

    const peopleAhead = myIndex;
    const estWait = Math.ceil((myIndex + 1) / seatsCount) * avgService;
    const myBooking = waiting[myIndex];

    const turnCfg = (biz.lineMessages && biz.lineMessages.turn) || {};
    if(biz.lineEnabled && turnCfg.enabled && myBooking.lineUserId && !myBooking.lineTurnSent && peopleAhead <= (turnCfg.aheadCount != null ? turnCfg.aheadCount : 0)){
      sendLineMessageForEvent(bizId, bookingDocId, 'turn');
      db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingDocId).set({ lineTurnSent: true }, { merge: true });
    }

    block.innerHTML = `
      <div class="grid grid-cols-2 gap-3">
        <div>
          <div class="text-[10px] text-amber-700">عدد الأشخاص أمامك</div>
          <div class="text-2xl font-extrabold text-amber-700 font-mono">${peopleAhead}</div>
        </div>
        <div>
          <div class="text-[10px] text-amber-700">وقت الانتظار المتوقع</div>
          <div class="text-2xl font-extrabold text-amber-700 font-mono">~${estWait} <span class="text-xs">د</span></div>
        </div>
      </div>
      ${seatsCount > 1 ? `<div class="text-[9px] text-indigo-600 mt-1">(بناءً على ${seatsCount} مقاعد/طاولات تعمل بالتوازي)</div>` : ''}
      <button onclick="loadQueuePosition('${bizId}','${bookingDocId}')" class="ghost-btn text-[10px] px-2.5 py-1 rounded-lg font-bold mt-2">تحديث</button>
    `;
  }).catch(err => {
    block.innerHTML = `<div class="text-xs text-rose-600">تعذر حساب موقعك في الطابور: ${esc(err.message)}</div>`;
  });
}

function cancelMyTicket(bizId, bookingDocId){
  if(typeof navigator !== 'undefined' && navigator.onLine === false){
    alert('لا يوجد اتصال بالإنترنت — لا يمكن إلغاء الحجز الآن. يرجى المحاولة مجدداً عند عودة الاتصال.');
    return;
  }

  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingDocId).get().then(doc => {
    if(!doc.exists) return;
    const bk = doc.data();

    if(bk.visitorBirthdate){
      const entered = prompt('لتأكيد هويتك، يرجى إدخال تاريخ ميلادك المسجل عند الحجز (بصيغة YYYY-MM-DD):');
      if(!entered) return;
      if(entered.trim() !== bk.visitorBirthdate){
        alert('تاريخ الميلاد غير مطابق لما تم تسجيله عند الحجز. لا يمكن إلغاء الحجز.');
        return;
      }
    } else {
      if(!confirm('هل أنت متأكد من إلغاء هذا الحجز؟')) return;
    }

    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingDocId)
      .update({ status: 'cancelled', cancelledAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => {
        clearLocalBooking(bizId);
        db.collection(BIZ_COLLECTION_PATH).doc(bizId).get().then(bizDoc => {
          if(!bizDoc.exists) return;
          const biz = { id: bizDoc.id, ...bizDoc.data() };
          notifyBookingCreatedPush(biz, 'تم إلغاء الحجز', `تم إلغاء حجزك في ${biz.name || 'المحل'} بنجاح`, '');
        });
        route();
      })
      .catch(err => alert('تعذّر إلغاء الحجز: ' + err.message));
  });
}

/* جلب قائمة الانتظار الحالية وعرض "الدور الحالي" و"التالي" مباشرة في نافذة الكاميرا */
function getWaitingQueueOrdered(bizId){
  return db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).get().then(snap => {
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(b => b.status === 'waiting')
      .sort((a, b) => {
        const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return ta - tb;
      });
  });
}

function loadQueueTurnStatus(bizId){
  const el = document.getElementById('queueTurnStatus');
  if(!el) return;
  el.innerHTML = `<div class="text-slate-400">جاري تحميل الدور الحالي...</div>`;

  getWaitingQueueOrdered(bizId).then(waiting => {
    if(!el) return;
    if(waiting.length === 0){
      el.innerHTML = `<div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-center text-slate-400">لا يوجد أحد في قائمة الانتظار حالياً.</div>`;
      return;
    }
    const current = waiting[0];
    const next = waiting[1];
    el.innerHTML = `
      <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 flex justify-between items-center">
        <span class="font-bold text-emerald-800">الدور الحالي:</span>
        <span class="font-mono text-emerald-900">${esc(current.visitorName)} ${current.ticketNum ? '('+current.ticketNum+')' : ''}</span>
      </div>
      ${next ? `
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex justify-between items-center mt-1.5">
        <span class="font-bold text-slate-600">التالي:</span>
        <span class="font-mono text-slate-700">${esc(next.visitorName)} ${next.ticketNum ? '('+next.ticketNum+')' : ''}</span>
      </div>` : ''}
    `;
  }).catch(err => {
    if(el) el.innerHTML = `<div class="text-rose-600">تعذر تحميل الدور: ${esc(err.message)}</div>`;
  });
}

/* تخطي دور الزبون الحالي إن لم يحضر، ليصبح الدور تلقائياً لمن بعده */
function skipCurrentQueueTurn(bizId){
  getWaitingQueueOrdered(bizId).then(waiting => {
    if(waiting.length === 0){ alert('لا يوجد أحد في قائمة الانتظار حالياً.'); return; }
    const current = waiting[0];
    if(!confirm(`هل تريد تخطي دور "${current.visitorName}" لأنه لم يحضر؟ سيصبح الدور للشخص التالي.`)) return;

    db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(current.id)
      .update({ status: 'skipped', skippedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => {
        loadQueueTurnStatus(bizId);
        loadBookingsForStore(bizId);
      })

/* تخطي دور محدد مباشرة من جدول الحجوزات (يبقى ظاهراً بعلامة "متأخر" ولا يُحذف) */
function skipQueueBookingRow(bizId, bookingId){
  if(!confirm('هل تريد تخطي هذا الدور؟ سيبقى ظاهراً في القائمة بعلامة "متأخر".')) return;
  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(bookingId)
    .update({ status: 'skipped', skippedAt: firebase.firestore.FieldValue.serverTimestamp() })
    .then(() => {
      loadBookingsForStore(bizId);
      loadQueueTurnStatus(bizId);
    })
    .catch(err => alert('تعذر تخطي الدور: ' + err.message));
}

function checkScannedBooking(bizId, scannedText){
  // النص الممسوح الآن رابط كامل وليس معرّف الحجز فقط، نستخرج معرّف الحجز منه إن أمكن
  let scannedId = scannedText;
  const m = scannedText.match(/#\/ticket\/[^/]+\/([^/]+)\/?/);
  if(m) scannedId = m[1];

  db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(scannedId).get().then(doc => {
    if(!doc.exists){
      alert("كود التذكرة غير صحيح أو غير موجود لهذا المحل.");
      return;
    }
    const bk = doc.data();

    // حجوزات المواعيد/الفنادق (وقت أو تاريخ محدد مسبقاً) — لا يوجد "دور" تسلسلي، فقط تأكيد الحضور
    if(!bk.ticketNum){
      alert(`تم التحقق!\nالاسم: ${bk.visitorName}\nالموعد: ${bk.time || (bk.checkIn ? (bk.checkIn+' → '+bk.checkOut) : '')}\nالحالة: ${bk.status === 'cancelled' ? 'ملغى ⚠️' : 'مؤكد ✓'}`);
      restartQrScannerIfOpen(bizId);
      return;
    }

    // حجوزات الطابور: التحقق من الدور التسلسلي
    if(bk.status === 'cancelled'){ alert(`هذه التذكرة ملغاة.\nالاسم: ${bk.visitorName}`); restartQrScannerIfOpen(bizId); return; }
    if(bk.status === 'served'){ alert(`تم تسجيل دخول هذا الزبون مسبقاً.\nالاسم: ${bk.visitorName}`); restartQrScannerIfOpen(bizId); return; }
    if(bk.status === 'skipped'){ alert(`تم تخطي دور هذا الزبون سابقاً لعدم الحضور في وقته.\nالاسم: ${bk.visitorName}`); restartQrScannerIfOpen(bizId); return; }

    getWaitingQueueOrdered(bizId).then(waiting => {
      const myIndex = waiting.findIndex(b => b.id === scannedId);
      if(myIndex === -1){
        alert('تعذر تحديد موقع هذه التذكرة في قائمة الانتظار.');
        restartQrScannerIfOpen(bizId);
        return;
      }
      if(myIndex === 0){
        // دوره الآن — قبول الدخول
        db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(scannedId)
          .update({ status: 'served', servedAt: firebase.firestore.FieldValue.serverTimestamp() })
          .then(() => {
            const nextPerson = waiting[1] ? waiting[1].visitorName : 'لا يوجد أحد بعده';
            alert(`✓ دخول مقبول!\nالاسم: ${bk.visitorName} (${bk.ticketNum})\nالتالي في الطابور: ${nextPerson}`);
            loadQueueTurnStatus(bizId);
            loadBookingsForStore(bizId);
            restartQrScannerIfOpen(bizId);
          });
      } else {
        const currentPerson = waiting[0];
        alert(`⏳ ليس دورك بعد!\nالاسم: ${bk.visitorName} (${bk.ticketNum})\nالدور الحالي: ${currentPerson.visitorName} (${currentPerson.ticketNum || ''})\nيجب الانتظار حتى يحين دورك. إن كان الشخص الحالي متأخراً، استخدم زر "تخطي الدور الحالي".`);
        restartQrScannerIfOpen(bizId);
      }
    });
  });
}

/* إعادة تشغيل الماسح تلقائياً بعد كل عملية مسح طالما النافذة ما زالت مفتوحة، لتسريع مسح عدة تذاكر متتالية */
function restartQrScannerIfOpen(bizId){
  const modal = document.getElementById('scannerModal');
  if(!modal || modal.classList.contains('hidden') || !html5QrScanner) return;
  html5QrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 180, height: 180 } },
    (decodedText) => {
      html5QrScanner.stop();
      checkScannedBooking(bizId, decodedText);
    },
    () => {}
  ).catch(() => {});
}

      body.innerHTML = `<div class="text-center text-slate-500 text-2xl font-bold">لا يوجد أحد في الطابور حالياً</div>`;
      return;
    }

    const current = waiting[0];
    const rest = waiting.slice(1);

    body.innerHTML = `
      <div class="text-center">
        <div class="text-slate-400 text-lg font-bold tracking-widest">الدور الحالي</div>
        <div class="text-white text-[7rem] sm:text-[9rem] leading-none font-extrabold font-mono mt-2">${esc(current.ticketNum || '—')}</div>
      </div>
      ${rest.length ? `
        <div class="mt-10 pt-8 border-t border-slate-700 w-full max-w-2xl">
          <div class="text-slate-400 text-sm font-bold text-center mb-4">الأدوار التالية (${rest.length})</div>
          <div class="flex flex-wrap justify-center gap-3">
            ${rest.map(b => `<span class="text-slate-300 text-lg sm:text-xl font-mono font-bold bg-slate-800 px-4 py-1.5 rounded-lg">${esc(b.ticketNum || '—')}</span>`).join('')}
          </div>
        </div>
      ` : ''}
    `;
  }).catch(err => {
    const body = document.getElementById('displayBoardBody');
    if(body) body.innerHTML = `<div class="text-rose-400 text-sm">تعذر تحميل بيانات الطابور: ${esc(err.message)}</div>`;
  });
}

function kioskTakeTicket(bizId){
  const btn = document.getElementById('kioskTakeBtn');
  if(btn) btn.setAttribute('disabled', 'true');

  const docId = 'ticket_kiosk_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

  getNextQueueNumber(bizId).then(ticketNum => {
    return db.collection(`${BIZ_COLLECTION_PATH}/${bizId}/bookings`).doc(docId).set({
      ticketNum: ticketNum,
      status: 'waiting',
      guests: 1,
      visitorIp: USER_IP_ADDRESS,
      cancelToken: token,
      bookingLink: buildTicketLink(bizId, docId, token),
      fcmToken: getStoredFcmToken ? getStoredFcmToken() : null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()

/* إرسال التذكرة الحالية للطباعة عبر إطار مخفي في الخلفية (لا يُظهر أي شيء على الشاشة
   ولا يبدّل صفحة استخراج التذكرة الظاهرة) — تُستدعى تلقائياً عند الاستخراج أو يدوياً بالزر */
function printKioskTicket(){
  const statusEl = document.getElementById('kioskPrintStatus');
  if(!window.__kioskReceiptHtml){
    if(statusEl) statusEl.textContent = 'التذكرة غير جاهزة بعد للطباعة، يرجى الانتظار لحظة والمحاولة مجدداً.';
    return;
  }
  try{
    const old = document.getElementById('kioskPrintFrame');
    if(old) old.remove();

    const frame = document.createElement('iframe');
    frame.id = 'kioskPrintFrame';
    frame.style.cssText = 'position:fixed; right:-9999px; bottom:-9999px; width:1px; height:1px; border:0; opacity:0;';
    frame.setAttribute('aria-hidden', 'true');
    frame.onload = function(){
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch(e){}
    };
    document.body.appendChild(frame);
    frame.srcdoc = window.__kioskReceiptHtml;

    if(statusEl){
      statusEl.innerHTML = `<i data-lucide="printer-check" class="w-3.5 h-3.5"></i> تم إرسال التذكرة للطابعة`;
      lucide.createIcons();
    }
  } catch(e){
    if(statusEl) statusEl.textContent = 'تعذر إرسال التذكرة للطابعة تلقائياً — استخدم زر الطباعة اليدوي.';
  }
}
