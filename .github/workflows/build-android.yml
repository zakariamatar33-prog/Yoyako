name: Build Android App

# يعمل تلقائياً عند كل push على main، أو يدوياً من تبويب Actions في GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      # google-services.json يفعّل Firebase (ومنه FCM) داخل التطبيق نفسه.
      # الخيار الأول: ضعي الملف في جذر المستودع باسم google-services.json مباشرة.
      # الخيار الثاني (أكثر أماناً): أضيفيه كسر GOOGLE_SERVICES_JSON_BASE64 في
      # Settings → Secrets → Actions (محتوى الملف بعد تشفير base64).
      - name: Prepare google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            echo "تم العثور على google-services.json في جذر المستودع."
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json
            echo "تم فك تشفير google-services.json من الأسرار (Secrets)."
          else
            echo "⚠️ لم يتم توفير google-services.json — إشعارات FCM لن تعمل حتى تضيفيه."
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Copy google-services.json into android/app
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Configure AdMob (AndroidManifest + strings.xml)
        run: python3 scripts/patch_admob.py

      - name: Configure Google Services + release signing scaffold
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: python3 scripts/patch_signing.py

      - name: Configure App Links (open booking links directly in app)
        run: python3 scripts/patch_deeplinks.py

      - name: Bundle native bridge (esbuild)
        run: npm run build:bridge

      - name: Generate app icon & splash screen
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Print debug signing SHA256 fingerprint (for assetlinks.json)
        run: |
          echo "======================================================"
          echo "بصمة SHA256 لنسخة Debug (استخدميها فقط أثناء الاختبار،"
          echo "غير ثابتة بين كل تشغيل ما لم تُحفظ debug.keystore كسر):"
          echo "======================================================"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ -f "$DEBUG_KEYSTORE" ]; then
            keytool -list -v -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -storepass android -keypass android 2>&1 | grep -i "SHA256" || echo "⚠️ تعذر استخراج البصمة."
          else
            echo "⚠️ لم يتم العثور على debug.keystore في $DEBUG_KEYSTORE"
          fi
        continue-on-error: true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoyako-cloud-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ── نسخة موقّعة (Release) جاهزة لرفعها على Google Play ──────────────
      # تُبنى فقط إذا أضفتِ الأسرار الأربعة التالية في:
      # Settings → Secrets and variables → Actions
      #   KEYSTORE_BASE64      (ملف keystore.jks بعد تشفير base64)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      # راجعي README.md لطريقة إنشاء ملف الـ keystore وتشفيره.
      - name: Check for release signing secrets
        id: check_signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.check_signing.outputs.has_keystore == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write keystore.properties
        if: steps.check_signing.outputs.has_keystore == 'true'
        run: |
          cat > android/keystore.properties << EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Print release signing SHA256 fingerprint (for assetlinks.json)
        if: steps.check_signing.outputs.has_keystore == 'true'
        run: |
          echo "======================================================"
          echo "بصمة SHA256 لنسخة Release (هذه هي الثابتة — استخدمي هذه"
          echo "في ملف assetlinks.json الذي يُرفع على موقعك):"
          echo "======================================================"
          keytool -list -v -keystore android/app/release.keystore -alias "${{ secrets.KEY_ALIAS }}" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" 2>&1 | grep -i "SHA256" || echo "⚠️ تعذر استخراج البصمة."
        continue-on-error: true

      - name: Build signed release AAB (for Google Play)
        if: steps.check_signing.outputs.has_keystore == 'true'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build signed release APK (for direct install/testing)
        if: steps.check_signing.outputs.has_keystore == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload release AAB artifact
        if: steps.check_signing.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yoyako-cloud-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK artifact
        if: steps.check_signing.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yoyako-cloud-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
