name: Send Notifications

# يعمل تلقائياً كل 10 دقائق، ويمكن تشغيله يدوياً أيضاً من تبويب Actions
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Decode service account key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > service-account.json

      - name: Send notifications
        run: node scripts/send_notifications.js

      - name: Clean up service account file
        if: always()
        run: rm -f service-account.json
